<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0F13">
<title>컨테이너 운반비 견적 · 2026 안전운임</title>
<style>
  :root{
    --ink:#0A0F13; --panel:#121B21; --panel2:#0E161B; --line:#22323C;
    --text:#DCE6EB; --dim:#7B929E; --dim2:#546976;
    --amber:#F2B705; --steel:#6FB3DE; --red:#E8735C; --green:#5FBF8F;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
       -webkit-font-smoothing:antialiased}

  /* ── 상단 표지: 부두 사인보드 ── */
  header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:baseline;gap:14px;
         background:linear-gradient(180deg,#0E161B,#0A0F13)}
  .mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--amber);
        border:1px solid var(--amber);padding:3px 7px;border-radius:2px}
  h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
  header .sub{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-left:auto;letter-spacing:.05em}

  .wrap{display:grid;grid-template-columns:1fr 380px;height:calc(100dvh - 51px)}
  .sheetbtn{display:none}

  /* ── 대화 ── */
  .chat{overflow-y:auto;padding:22px 22px 120px;scroll-behavior:smooth}
  .turn{max-width:620px;margin:0 0 18px}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim2);margin-bottom:5px}
  .bot .body{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:11px 14px}
  .me{margin-left:auto;text-align:right}
  .me .body{display:inline-block;background:#1B2A33;border:1px solid #2C414D;border-radius:3px;padding:8px 13px;text-align:left}
  .note{color:var(--dim);font-size:12.5px;margin-top:6px}
  .warn{color:var(--amber);font-size:12.5px;margin-top:6px}
  .ok{color:var(--green);font-size:12.5px;margin-top:6px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  button.chip{font-family:var(--sans);font-size:13px;color:var(--text);background:#17222A;
    border:1px solid var(--line);border-radius:2px;padding:6px 11px;cursor:pointer;transition:.12s}
  button.chip:hover{border-color:var(--steel);color:#fff;background:#1D2C36}
  button.chip:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  button.chip.on{border-color:var(--amber);color:var(--amber);background:#1E1B0E}
  button.chip.go{border-color:var(--steel);color:#0A0F13;background:var(--steel);font-weight:600}
  button.chip .k{font-family:var(--mono);color:var(--dim2);font-size:11px;margin-left:5px}
  button.chip.on .k{color:var(--amber)}

  /* ── 입력 ── */
  .bar{position:sticky;bottom:0;margin:0 -22px -120px;padding:14px 22px 22px;
       background:linear-gradient(180deg,rgba(10,15,19,0),var(--ink) 26%);display:flex;gap:8px}
  .bar input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:2px;
    padding:10px 12px;color:var(--text);font-family:var(--sans);font-size:14px}
  .bar input:focus{outline:none;border-color:var(--steel)}
  .bar button{background:var(--steel);color:#0A0F13;border:0;border-radius:2px;padding:0 16px;
    font-weight:650;cursor:pointer;font-family:var(--sans)}

  /* ── 우측 명세서: 운송장 ── */
  .dock{border-left:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:20px 18px 40px;position:relative}
  .dock::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:1px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px)}
  .dock h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim2);margin:0 0 14px;font-weight:400}
  .ledger{font-family:var(--mono);font-size:12px}
  .ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted #1C2A32}
  .ln .l{color:var(--dim)}
  .ln .v{color:var(--text);white-space:nowrap}
  .ln.head{border-bottom:1px solid var(--line);color:var(--steel);padding-top:12px}
  .ln.head .l{color:var(--steel)}
  .ln.sub .l{padding-left:10px;color:var(--dim2)}
  .ln.neg .v{color:var(--red)}
  .empty{color:var(--dim2);font-size:12.5px;line-height:1.7}

  .stamp{margin-top:18px;border:1px solid var(--amber);border-radius:2px;padding:12px 14px;background:#1A1608}
  .stamp .t{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--amber);margin-bottom:8px}
  .stamp .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:3px 0;color:var(--dim)}
  .stamp .row b{color:var(--text);font-weight:500}
  .stamp .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:9px;
    border-top:1px solid #3D3410}
  .stamp .big span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
  .stamp .big b{font-family:var(--mono);font-size:19px;color:var(--amber);font-weight:600;letter-spacing:-.01em}

  .why{margin-top:14px}
  .why summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim2);cursor:pointer;
    list-style:none;padding:7px 0;border-top:1px solid var(--line)}
  .why summary::-webkit-details-marker{display:none}
  .why summary:hover{color:var(--steel)}
  .why ol{font-family:var(--mono);font-size:11px;color:var(--dim);padding-left:18px;margin:6px 0 0;line-height:1.85}
  .why code{color:var(--steel)}
  .why .cite{color:var(--dim2)}

  .reset{margin-top:22px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim2);
    background:none;border:1px solid var(--line);border-radius:2px;padding:7px 10px;cursor:pointer;width:100%}
  .reset:hover{border-color:var(--red);color:var(--red)}

  /* ── 모바일: 대화 전면, 명세서는 끌어올리는 하단 시트 ── */
  @media (max-width:820px){
    body{font-size:15px}
    header{padding:11px 16px;gap:10px}
    header .sub{display:none}
    h1{font-size:14px}
    .wrap{display:block;height:auto}
    .chat{height:calc(100dvh - 47px);padding:16px 16px 150px}
    .turn{max-width:100%}
    .bar{margin:0 -16px -150px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
         background:var(--ink);border-top:1px solid var(--line);gap:8px}
    .bar input{font-size:16px;padding:12px}      /* iOS 자동 확대 방지 */
    .bar button{padding:0 18px}
    button.chip{padding:10px 14px;font-size:14.5px}   /* 손가락 타겟 44px */

    /* 하단 시트 */
    .sheetbtn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
      align-items:center;justify-content:space-between;gap:12px;
      padding:11px 16px calc(11px + env(safe-area-inset-bottom));
      background:#141B10;border-top:1px solid var(--amber);cursor:pointer}
    .sheetbtn .t{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--amber)}
    .sheetbtn .n{font-family:var(--mono);font-size:15px;color:var(--amber);font-weight:600}
    .sheetbtn .n small{color:var(--dim);font-size:10px;letter-spacing:.1em;margin-left:6px}
    body.hassheet .bar{bottom:0}
    body.hassheet .chat{padding-bottom:210px}

    .dock{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;
      max-height:88dvh;overflow-y:auto;border:0;border-top:1px solid var(--amber);
      border-radius:12px 12px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
      transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
      box-shadow:0 -18px 40px rgba(0,0,0,.55)}
    .dock::before{display:none}
    .dock::after{content:"";display:block;position:sticky;top:0;height:4px;width:38px;margin:6px auto 12px;
      background:var(--line);border-radius:2px}
    body.sheetopen .dock{transform:translateY(0)}
    body.sheetopen{overflow:hidden}
    .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
      transition:opacity .26s}
    body.sheetopen .scrim{opacity:1;pointer-events:auto}
    .dock h2{position:sticky;top:12px;background:var(--panel2);padding-bottom:8px;margin-bottom:6px}
    .stamp .big b{font-size:22px}
  }
  @media (min-width:821px){ .scrim{display:none} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <span class="mark">KYL</span>
  <h1>컨테이너 운반비 견적</h1>

  <div class="scrim" id="scrim"></div>

    <div id="whybox"></div>
    <button class="reset" id="reset">처음부터 다시</button>
  </aside>

function parse(raw){
  let t = ' '+raw+' ', got = {sur:[]};

  // 기점: "…에서/발/기점/출발" 우선, 없으면 첫 별칭
  const m = t.match(/([가-힣A-Za-z]+)\s*(?:에서|발|기점|출발)/);
  const scan = (s)=>{ for(const [a,c] of ORI_ALIAS) if(s.includes(a)) return [a,c]; return null; };
  let hit = m ? scan(m[1]) : null;
  if(hit){ got.origin=hit[1]; t=t.replace(m[0],' '); }
  else { hit = scan(t); if(hit){ got.origin=hit[1]; t=t.replace(hit[0],' '); } }

  // 규격
  if(/콤바인|컴바인|combine/i.test(t)){ got.size='CB2'; t=t.replace(/콤바인|컴바인|combine/ig,' '); }
  let g = t.match(/(40|20|45)\s*(?:ft|feet|피트|피|FT)/i);      // 단위 붙은 경우 먼저
  if(!g) g = t.match(/(?:^|\s)(40|20|45)(?=\s|$)/);              // 맨숫자
  if(g && !got.size){ got.size = g[1]+'FT'; t=t.replace(g[0],' '); }

  // 수량 · 중량
  const q = t.match(/(\d+)\s*(?:대|개|컨|본)/);
  if(q){ got.qty=+q[1]; t=t.replace(q[0],' '); }
  const w = t.match(/(\d+(?:\.\d+)?)\s*톤/);
  if(w){ got.ton=parseFloat(w[1]); t=t.replace(w[0],' '); }

  // 운송형태
  for(const k in MODE_WORD) if(t.includes(k)){ got.mode=MODE_WORD[k]; t=t.replace(k,' '); break; }
  if(/편도/.test(t)){ got.oneway=true; t=t.replace(/편도/g,' '); }
  if(/왕복/.test(t)){ got.mode=got.mode||'왕복'; t=t.replace(/왕복/g,' '); }

  // 할증
  for(const k in SUR_WORD) if(t.includes(k)){ const id=SUR_WORD[k]; if(!got.sur.includes(id)) got.sur.push(id); t=t.replace(k,' '); }

  // 남은 말 = 행선지
  got.dest = t.replace(/운반비|운임|견적|얼마|알려줘|해줘|주세요|까지|가는|피트|feet|ft|→|->|=>|~/gi,' ')
              .replace(/\s+/g,' ').trim();
  return got;
}

const DIDX = {};
DONGS.forEach((d,i)=> DIDX[norm(d[0])+'|'+norm(d[1])+'|'+norm(d[2])] = i);
function toIndex(h){
  const sd = norm(h.sd);

    sd+'|'+gu.replace(/(화성시).+구$/,'$1')+'|'+norm(h.dong),   // 화성시 구 접기

  ];

}

/* ══════════ 주소 → 행정동 (오프라인 폴백) ══════════
   지역(시·도/시·군·구)을 먼저 확정한 뒤, 동 이름은 "토큰 단위 완전일치"로만 찾는다.
   부분문자열 매칭은 쓰지 않는다 — '서정동'이 '정동'에 걸리는 사고를 막는다. */
const SD_ALIAS = {'서울':'서울특별시','부산':'부산광역시','대구':'대구광역시','인천':'인천광역시',
  '광주':'광주광역시','대전':'대전광역시','울산':'울산광역시','세종':'세종특별자치시','경기':'경기도',
  '강원':'강원특별자치도','충북':'충청북도','충남':'충청남도','전북':'전북특별자치도','전남':'전라남도',
  '경북':'경상북도','경남':'경상남도','제주':'제주특별자치도'};

const GU = {};    // 시·군·구 별칭 → 행선지 인덱스 집합
DONGS.forEach((d,i)=>{
  const gu = norm(d[1]); if(!gu) return;
  const names = new Set([gu]);
  const m = gu.match(/^(.+시)(.+구)$/);           // 창원시마산합포구 → 창원시 / 마산합포구
  if(m){ names.add(m[1]); names.add(m[2]); }
  [...names].forEach(nm=>{ const s = nm.replace(/(시|군|구)$/,''); if(s.length>=2) names.add(s); });
  names.forEach(nm=>{ (GU[nm] = GU[nm] || new Set()).add(i); });
});
const GU_KEYS = Object.keys(GU).sort((a,b)=>b.length-a.length);

const BJR = {};   // 법정동명 → [{i, sd, gu}]
for(const k in BJ){
  const [sd,gu,bd] = k.split('|');
  BJ[k].forEach(i=> (BJR[bd] = BJR[bd] || []).push({i, sd, gu}));
}

function search(q){
  let t = norm(q);
  if(t.length < 2) return [];

  // 1) 시·군·구 확정 (가장 긴 것 우선)
  let pool = null, guHit = null;
  for(const k of GU_KEYS){
    if(k.length >= 2 && t.includes(k)){ pool = GU[k]; guHit = k; t = t.replace(k,' '); break; }
  }
  // 2) 시·도 확정
  let sdHit = null;
  for(const k in SD_ALIAS){ if(t.includes(k)){ sdHit = SD_ALIAS[k]; t = t.replace(k,' '); break; } }

  // 3) 동 토큰 (2글자 이상, 지번·숫자 제외)
  const toks = t.split(/[^가-힣]+/).filter(x=>x.length>=2);
  if(!toks.length) return [];

  const hits = new Map();
  const add = (i, sc, via) => {
    if(pool && !pool.has(i)) return;
    if(sdHit && DONGS[i][0] !== sdHit) return;
    const p = hits.get(i) || {i, sc:0, via:[]};
    p.sc = Math.max(p.sc, sc);
    if(via && !p.via.includes(via)) p.via.push(via);
    hits.set(i, p);
  };

  toks.forEach(tk=>{
    // 3-a) 법정동 완전일치 → 그 법정동을 관할하는 행정동들
    (BJR[tk] || []).forEach(r=>{
      let sc = 100;
      if(guHit && (norm(r.gu).includes(guHit) || guHit.includes(norm(r.gu)))) sc += 50;
      add(r.i, sc, tk);
    });
    // 3-b) 행정동 완전일치 (또는 '서정' → '서정동' 처럼 접미사만 생략)
    DONGS.forEach((d,i)=>{
      const dn = norm(d[2]);
      if(dn === tk)                                     add(i, 110, null);
      else if(dn === tk+'동' || dn === tk+'읍' || dn === tk+'면') add(i, 95, null);
    });
  });

  return [...hits.values()].sort((a,b)=>b.sc - a.sc).slice(0,12);
}

/* 법정동이 행정동 여러 곳에 걸쳐 있으면 반드시 확인받는다.
   운임 차이가 작아도 자동으로 고르지 않는다 — 틀린 행정동은 틀린 견적이다. */
function pickDong(cands){
  if(cands.length===1) return confirmDong(cands[0].i);

  const via = cands[0].via && cands[0].via.length ? cands[0].via[0] : null;
  const rows = cands.map(c=>{
    const r = lookup(S.origin, c.i);
    return { i:c.i, km:DIST[S.origin][c.i], fare:r?r[2]:0 };   // 40FT 안전운송운임 기준 표시
  }).sort((a,b)=>a.km-b.km);

  const head = via
    ? `법정동 <b>${via}</b>은 행정동 <b>${rows.length}곳</b>에 걸쳐 있습니다. 공장·창고가 어느 행정동 관할입니까?`
    : `행선지 후보가 ${rows.length}곳입니다. 어디입니까?`;

  const chips = rows.map(x=>({
    t:`${DONGS[x.i][1]} <b>${DONGS[x.i][2]}</b>`, k:`${x.km}km · ${won(x.fare)}`,
    f:()=>{ me(DONGS[x.i][1]+' '+DONGS[x.i][2]); confirmDong(x.i); }
  }));

  const hint = rows.map(x=>{
    const c = COV[x.i];
    return c ? `<b>${DONGS[x.i][2]}</b> 관할 법정동 — ${c.join(', ')}` : `<b>${DONGS[x.i][2]}</b>`;
  }).join('<br>');

  bot(head, chips,
    `운임은 40FT 안전운송운임 기준입니다. 관할이 헷갈리면 아래를 참고하세요.<br><br>${hint}`);
}

function confirmDong(i, msg, ok){
  S.dong=i;
  const d=DIST[S.origin][i], c=COV[i];
  bot(`<b>${S.origin} → ${DONGS[i][1]} ${DONGS[i][2]}</b> · 구간거리 <b>${d}km</b>`
      + (ok?`<div class="ok">${ok}</div>`:'')
      + (msg?`<div class="warn">${msg}</div>`:''),
      null,
      c ? `행정동 ${DONGS[i][2]} 관할 법정동: ${c.join(', ')}` : null);
  draw(); next();
}

/* ══════════ 조회 ══════════ */
function lookup(o, i){                    // 왕복 기본운임 6열
  const d=DIST[o][i]; if(!d) return null;
  if(SUR[o]) return SUR[o][d] || null;    // 인천3·평택: 할증 반영된 전용표
  return RATE[Math.min(d,550)] || null;
}
function onewayRow(o,i){ const L=편도노선[o]; return L && ONE[L] && ONE[L][i] ? ONE[L][i] : null; }
function 편도가능(){ if(!S.origin||S.dong==null||!onewayRow(S.origin,S.dong)) return false;
  const [sd,gu]=DONGS[S.dong];
  return 수도권.includes(sd) || (sd==='강원특별자치도' && 수도권강원.includes(gu)); }

/* ══════════ 진행 ══════════
   next()는 상태(S)를 보고 아직 안 채워진 항목을 순서대로 되묻는 라우터다.
   기점 → 행선지 → 규격 → (편도여부) → 운송형태 → 견적 확정.
   할증·부대비용은 finish() 이후 버튼으로만 붙이므로 여기서 다루지 않는다. */
function askOrigin(){
  bot('<b>기점</b>은 어디입니까?',
      기점.map(o=>({t:o, f:()=>{S.origin=o; S.dong=null; me(o); draw(); next();}})));
}
function next(){
  if(!S.origin)      return askOrigin();
  if(S.dong==null)   return askDest();
  if(!S.size)        return askSize();

  // 편도(의왕ICD 반납)를 택하면 형태 배수 없이 편도표를 그대로 쓴다 → mode를 왕복(×1)로 고정
  if(S.oneway){ if(!S.mode) S.mode='왕복'; S.modeSet=true; }

  if(!S.modeSet){
    if(!S.owAsked && 편도가능()) return askOneway();   // 편도 적용 가능하면 먼저 물어봄
    return askMode();
  }
  return finish();
}
function askSize(){
  bot('<b>컨테이너 규격</b>은?', 규격.map(g=>({t:g.n, f:()=>{S.size=g.id; me(g.n); draw(); next();}})));
}
function askMode(){
  const list=형태.map(m=>({t:m.n, k:m.m!==1?`×${m.m}`:'', f:()=>{S.mode=m.id; S.modeSet=true; me(m.n); draw(); next();}}));
  bot('<b>운송 형태</b>는?', list, '보통은 <b>일반 왕복</b>입니다.');
}
function askOneway(){
  S.owAsked=true;
  bot('수도권 화주공장이고 공컨 반납·수령지가 <b>의왕ICD</b>이면 편도운임을 적용합니다. 해당됩니까?',
    [{t:'예 · 의왕ICD 편도', f:()=>{S.oneway=true; me('의왕ICD 편도'); draw(); next();}},
     {t:'예 · 공컨은 인천터미널 반납', k:'+40,000', f:()=>{S.oneway=true; S.incheonReturn=true; me('의왕ICD 편도 + 인천터미널 반납'); draw(); next();}},
     {t:'아니오 · 왕복', f:()=>{me('왕복'); draw(); next();}}],
    '별표1 9.가 · 특수컨(냉동·냉장, O/T, FR)은 이 경우에도 왕복');
}

function askSur(){
  const on=new Set();
  const chips=할증.map(h=>({t:h.n, k:`+${Math.round(h.r*100)}%`, multi:true,
    f:v=>{ v?on.add(h.id):on.delete(h.id); S.sur=[...on]; draw(); }}));
  chips.push({t:'중량물 (톤 입력)', k:'+10%/t', f:()=>{ askTon(on); }});
  chips.push({t:'적용', cls:'go', f:()=>{ S.sur=[...on]; me(S.sur.length?S.sur.join(', '):'할증 없음'); draw(); finish(); }});
  bot('<b>할증</b> 해당 항목을 모두 고르고 <b>선택 완료</b>를 누르세요.', chips,
      '별표1 22 · 여러 개면 가장 높은 1개는 전액, 나머지는 각 50%만, 최대 3개까지 합산합니다.');
}
function askTon(on){
  bot('컨테이너 <b>내품 중량</b>은 몇 톤입니까? 숫자로 입력하세요.', null,
      '별표1 23.가 · 40FT 23톤 / 20FT 20톤 초과분 매 1톤마다 10%');
  step=3; window._surSet=on;
}
function askExtra(){
  const on=new Set(S.extra);
  const chips=부대.map(e=>({t:e.n, k:won(e.v), multi:true,
    f:v=>{ v?on.add(e.id):on.delete(e.id); S.extra=[...on]; draw(); }}));
  chips.push({t:'대기료 입력', f:()=>{ askWait(); }});
  chips.push({t:'통행료·실비 입력', f:()=>{ askToll(); }});
  chips.push({t:'적용', cls:'go', f:()=>{ S.extra=[...on]; me('부대비용 적용'); draw(); finish(); }});
  bot('<b>부대비용</b>이 있으면 고르세요.', chips, '별표1 24·25·27');
}
function askWait(){ bot('대기시간을 <b>항만,화주문전</b> 순으로 분 단위 입력하세요. 예: <code>90,0</code>', null,
  '별표1 24 · 항만 1시간 초과, 화주문전 40FT 2시간30분·20FT 2시간 초과분에 대해 30분당 20,000원'); step=4; }
function askToll(){ bot('통행료·선박이용료 등 <b>실비 합계</b>를 원 단위로 입력하세요.', null, '별표1 27'); step=5; }

/* ══════════ 계산 ══════════ */
function calc(){
  if(S.dong==null||!S.size||!S.mode) return null;
  const g=규격.find(x=>x.id===S.size), m=형태.find(x=>x.id===S.mode);
  const w=[]; // 근거 로그
  let row, km, srcNote;

  if(S.oneway){
    const o=onewayRow(S.origin,S.dong); row=o.slice(1); km=o[0];
    srcNote=`편도 기점별 운임표 (${편도노선[S.origin]}) · ${km}km`;
  } else {
    row=lookup(S.origin,S.dong); km=DIST[S.origin][S.dong];
    srcNote=`왕복 기점별 운임표 (${S.origin}) · 구간거리 ${km}km`;
  }
  if(!row) return null;
  const col=g.col;
  const base=[row[col],row[col+1],row[col+2]];   // 위탁 / 사업자간 / 운송
  w.push(`${srcNote} → 기본 ${g.n==='45FT'?'40FT':(col===0?'40FT':'20FT')} 운임 <code>${won(base[0])} / ${won(base[1])} / ${won(base[2])}</code>`);

  // 규격·형태 배수
  let mul=g.m*m.m;
  if(g.m!==1) w.push(`규격 배수 ×${g.m} <span class="cite">(${g.c})</span>`);
  if(m.m!==1) w.push(`형태 배수 ×${m.m} <span class="cite">(${m.c})</span>`);
  let unit=base.map(v=>v*mul);

  // 할증 합산 (별표1 22)
  const rates=[];
  S.sur.forEach(id=>{ const h=할증.find(x=>x.id===id); rates.push({n:h.n, r:h.r, c:h.c}); });
  if(S.ton>0){
    const lim = (col===0)?23:20;
    const over = Math.max(0, Math.ceil(S.ton-lim));
    if(over>0) rates.push({n:`중량물 ${S.ton}톤 (${lim}톤 초과 ${over}톤)`, r:over*0.10, c:'별표1 23.가'});
  }
  rates.sort((a,b)=>b.r-a.r);
  const use=rates.slice(0,3), drop=rates.slice(3);
  let total=0;
  use.forEach((h,i)=>{ const eff = i===0 ? h.r : h.r*0.5; h.eff=eff; total+=eff; });
  if(use.length){
    w.push(`할증 합산 <code>${(total*100).toFixed(0)}%</code> = `+use.map((h,i)=>
      `${h.n} ${(h.r*100).toFixed(0)}%${i?'×50%':''}`).join(' + ')+` <span class="cite">(별표1 22)</span>`);
    if(drop.length) w.push(`<span class="cite">3개 초과분 제외: ${drop.map(d=>d.n).join(', ')}</span>`);
  }
  const sur = unit.map(v=>v*total);
  unit = unit.map((v,i)=>v+sur[i]);
  unit = unit.map(r100);

  // 대당 → 총액
  let sum = unit.map(v=>v*S.qty);

  // 건당 정액
  const adds=[];
  if(S.oneway && S.incheonReturn) adds.push({n:'인천터미널 공컨 반납', v:40000*S.qty, c:'별표1 9.가 단서'});
  S.extra.forEach(id=>{ const e=부대.find(x=>x.id===id); adds.push({n:e.n, v:e.v*S.qty, c:e.c}); });
  const wtLimit = (col===0)?150:120;
  if(S.wait.port>60) adds.push({n:`항만 대기 ${S.wait.port}분`, v:Math.floor((S.wait.port-60)/30)*20000*S.qty, c:'별표1 24.가'});
  if(S.wait.gate>wtLimit) adds.push({n:`화주문전 대기 ${S.wait.gate}분`, v:Math.floor((S.wait.gate-wtLimit)/30)*20000*S.qty, c:'별표1 24.나'});
  if(S.toll>0) adds.push({n:'통행료·실비', v:S.toll, c:'별표1 27'});
  const addSum = adds.reduce((a,b)=>a+b.v,0);
  sum = sum.map(v=>v+addSum);

  return {km, base, unit, sum, adds, use, drop, total, w, g, m, srcNote};
}

/* ══════════ 명세서 ══════════ */
function draw(){
  const L=document.getElementById('ledger'), ST=document.getElementById('stampbox'), WH=document.getElementById('whybox');
  const c=calc();
  if(!c){
    L.innerHTML = S.origin
      ? `<div class="ledger"><div class="ln"><span class="l">기점</span><span class="v">${S.origin}</span></div>`
        + (S.dong!=null?`<div class="ln"><span class="l">행선지</span><span class="v">${DONGS[S.dong][1]} ${DONGS[S.dong][2]}</span></div>
           <div class="ln"><span class="l">구간거리</span><span class="v">${DIST[S.origin][S.dong]} km</span></div>`:'')
        + `</div>`
      : `<p class="empty">기점과 행선지를 정하면<br>여기에 산출 내역이 쌓입니다.</p>`;
    ST.innerHTML=''; WH.innerHTML=''; if(window.sheetSummary) sheetSummary(); return;
  }
  const N=['안전위탁운임','운수사업자 간 운임','안전운송운임'];
  let h=`<div class="ledger">
    <div class="ln"><span class="l">기점</span><span class="v">${S.origin}</span></div>
    <div class="ln"><span class="l">행선지</span><span class="v">${DONGS[S.dong][1]} ${DONGS[S.dong][2]}</span></div>
    <div class="ln"><span class="l">${S.oneway?'편도 운행거리':'구간거리'}</span><span class="v">${c.km} km</span></div>
    <div class="ln"><span class="l">규격 · 형태</span><span class="v">${c.g.n} · ${S.oneway?'편도':c.m.n}</span></div>
    <div class="ln"><span class="l">수량</span><span class="v">${S.qty} 대</span></div>`;
  if(c.use.length) h+=`<div class="ln"><span class="l">할증 합산</span><span class="v">+${(c.total*100).toFixed(0)}%</span></div>`;
  h+=`<div class="ln head"><span class="l">대당 운임</span><span class="v"></span></div>`;
  c.unit.forEach((v,i)=> h+=`<div class="ln sub"><span class="l">${N[i]}</span><span class="v">${won(v)}</span></div>`);
  if(c.adds.length){
    h+=`<div class="ln head"><span class="l">부대비용</span><span class="v"></span></div>`;
    c.adds.forEach(a=> h+=`<div class="ln sub"><span class="l">${a.n}</span><span class="v">${won(a.v)}</span></div>`);
  }
  L.innerHTML=h+`</div>`;

  const vat=x=>Math.round(x*0.1);
  ST.innerHTML=`<div class="stamp"><div class="t">합계 · 부가세 별도</div>`
    + c.sum.map((v,i)=>`<div class="row"><span>${N[i]}</span><b>${won(v)}</b></div>`).join('')
    + `<div class="big"><span>안전운송운임 + VAT</span><b>${won(c.sum[2]+vat(c.sum[2]))}</b></div></div>`;

  WH.innerHTML=`<details class="why"><summary>산출 근거 보기 ▾</summary><ol>`
    + c.w.map(x=>`<li>${x}</li>`).join('')
    + `<li>대당 운임 십원 단위 반올림 <span class="cite">(별표1 7)</span></li>`
    + `<li>× ${S.qty}대${c.adds.length?' + 부대비용':''}</li>`
    + `<li>모든 금액 부가세 별도 <span class="cite">(별표1 8)</span></li></ol></details>`;
  if(window.sheetSummary) sheetSummary();
}

/* ══════════ 결과 ══════════ */
function finish(){
  S.done=true; step=0;
  const c=calc(); if(!c){ bot('입력이 부족합니다.'); return; }
  const N=['안전위탁운임','운수사업자 간 운임','안전운송운임'];
  const vat=x=>Math.round(x*0.1);
  const cond = [c.g.n, S.oneway?'의왕ICD 편도':c.m.n, S.qty+'대']
    .concat(S.sur.length?[`할증 +${(c.total*100).toFixed(0)}%`]:[]).join(' · ');

  bot(`<b>${S.origin} → ${DONGS[S.dong][1]} ${DONGS[S.dong][2]}</b> · ${c.km}km<br>`
    + `<div class="note" style="margin-top:2px">${cond}</div>`
    + `<div class="note" style="margin-top:10px">`
    + c.sum.map((v,i)=>`${N[i]} <b style="color:var(--text)">${won(v)}</b> <span style="color:var(--dim2)">VAT포함 ${won(v+vat(v))}</span>`).join('<br>')
    + `</div>`,
    [
      {t:'할증 추가', f:()=>askSur()},
      {t:'수량 변경', f:()=>askQty()},
      {t:'운송형태 변경', f:()=>{S.modeSet=false; S.owAsked=false; askMode();}},
      {t:'부대비용', f:()=>askExtra()},
      {t:'새 견적', cls:'go', f:()=>reset()},
    ],
    '조건을 더 붙이려면 위 버튼을 쓰거나, 그냥 문장으로 적으셔도 됩니다. 예: <code>심야 냉동 3대</code>');
  draw();
  if(window.matchMedia('(max-width:820px)').matches) setTimeout(openSheet,260);
}
function askQty(){
  bot('<b>수량</b>은 몇 대입니까?', [1,2,3,5,10].map(q=>({t:q+'대', f:()=>{S.qty=q; me(q+'대'); draw(); finish();}})),
      '다른 수량은 숫자로 입력하세요.');
  step=2;
}

/* ══════════ 입력 처리 ══════════ */
const inp=document.getElementById('inp');
function submit(){
  const v=inp.value.trim(); if(!v) return; inp.value='';

  // 숫자 입력을 기다리는 중이면 그것부터 처리
  if(step===2){ const q=parseInt(v.replace(/\D/g,'')); if(q>0){ S.qty=q; me(q+'대'); draw(); finish(); return; } }
  if(step===3){ const x=parseFloat(v); if(x>0){ S.ton=x; me(x+'톤'); draw();
      const on=window._surSet||new Set(); S.sur=[...on]; finish(); return; } }
  if(step===4){ const [a,b]=v.split(/[,\s]+/).map(x=>parseInt(x)||0); S.wait={port:a||0,gate:b||0};
      me(`항만 ${a||0}분 / 문전 ${b||0}분`); draw(); finish(); return; }
  if(step===5){ const n=parseInt(v.replace(/\D/g,''))||0; S.toll=n; me(won(n)); draw(); finish(); return; }

  me(v);
  const p = parse(v);
  let changed = false, needDest = false;

  if(p.origin && p.origin!==S.origin){ S.origin=p.origin; S.dong=null; changed=true; }
  if(p.size){ S.size=p.size; changed=true; }
  if(p.qty){ S.qty=p.qty; changed=true; }
  if(p.ton){ S.ton=p.ton; changed=true; }
  if(p.mode){ S.mode=p.mode; S.modeSet=true; changed=true; }
  if(p.oneway){ S.oneway=true; S.owAsked=true; changed=true; }
  if(p.sur.length){ p.sur.forEach(s=>{ if(!S.sur.includes(s)) S.sur.push(s); }); changed=true; }

  if(step===1 || (p.dest && p.dest.length>=2 && S.dong==null)) needDest = true;
  else if(p.dest && p.dest.length>=2 && !p.origin && !changed) needDest = true;   // 행선지만 바꾸는 경우

  if(needDest && p.dest){
    if(!S.origin){ draw(); bot('기점을 먼저 골라 주세요.', 기점.map(o=>({t:o,
        f:()=>{S.origin=o; me(o); resolveDest(p.dest);}}))); return; }
    draw(); resolveDest(p.dest); return;
  }
  if(!S.origin){ draw(); return askOrigin(); }
  if(S.dong==null){ draw(); return askDest(); }

  draw();
  if(changed && S.size && S.modeSet) return finish();
  next();
}
document.getElementById('send').onclick=submit;
inp.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
document.getElementById('reset').onclick=()=>{ closeSheet(); reset(); };

/* ── 모바일 하단 시트 ── */
const SB=document.getElementById('sheetbtn'), SC=document.getElementById('scrim');
const openSheet =()=>{ document.body.classList.add('sheetopen'); SB.setAttribute('aria-expanded','true'); };
const closeSheet=()=>{ document.body.classList.remove('sheetopen'); SB.setAttribute('aria-expanded','false'); };
SB.onclick=()=> document.body.classList.contains('sheetopen') ? closeSheet() : openSheet();
SC.onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
function sheetSummary(){
  const c=calc();
  document.body.classList.toggle('hassheet', !!c);
  if(!c){ document.getElementById('sheetsum').textContent='—'; return; }
  document.getElementById('sheetsum').innerHTML = won(c.sum[2]) + '<small>안전운송 · VAT별도</small>';
}

reset();
</script>
</body>
</html>
