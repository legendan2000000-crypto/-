<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배차일보 (샘플)</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#fff; --line:#e3e8ef; --text:#1a2233; --muted:#68758a;
    --accent:#2563eb; --accent-soft:#e8f0fe; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 1px 2px rgba(20,30,50,.04);
    --io-i:#0369a1; --io-i-bg:#e0f2fe; --io-o:#9333ea; --io-o-bg:#f3e8ff;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1420;--panel:#171d2b;--line:#28303f;--text:#e6ebf3;--muted:#8b97ad;
      --accent:#5b8cff;--accent-soft:#1b2740;--io-i-bg:#0c2233;--io-o-bg:#241033;--shadow:none;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .bar h1{font-size:16px;margin:0 8px 0 0;font-weight:700;white-space:nowrap}
  .tabs{display:flex;gap:4px;background:var(--bg);border-radius:9px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
  .tabs button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
  .grow{flex:1}
  input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .search{min-width:200px;flex:1;max-width:340px}
  .date{width:140px}
  button.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
  button.btn:hover{border-color:var(--accent);color:var(--accent)}
  button.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 10px}
  .fdrop{position:relative}
  .fdrop>button{font-size:12.5px;padding:5px 10px}
  .fdrop>button .cnt{color:var(--accent);font-weight:700}
  .fmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,50,.16);padding:8px;min-width:180px;max-height:320px;overflow:auto;display:none}
  .fmenu.open{display:block}
  .fmenu label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
  .fmenu label:hover{background:var(--bg)}
  .fmenu .tools{display:flex;justify-content:space-between;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .fmenu .tools a{color:var(--accent);cursor:pointer;font-size:12px}
  main{padding:12px 14px 40px}
  .meta{color:var(--muted);font-size:12.5px;margin:2px 2px 10px;display:flex;gap:14px;flex-wrap:wrap}
  .meta b{color:var(--text)}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--panel);z-index:5;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
  th:hover{color:var(--accent)}
  tbody tr:hover{background:var(--accent-soft)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:700}
  .io-I{color:var(--io-i);background:var(--io-i-bg)} .io-O{color:var(--io-o);background:var(--io-o-bg)}
  .div-용차{color:var(--warn)}
  .cntr .b{font-family:ui-monospace,Menlo,Consolas,monospace}
  .cbadge{margin-left:5px;font-size:11px;font-weight:700}
  .cbadge.ok{color:var(--ok)} .cbadge.bad{color:var(--bad)} .cbadge.na{color:var(--muted)}
  .amt-hide .amt{display:none !important}
  .foot{display:flex;justify-content:center;gap:8px;align-items:center;padding:14px}
  .foot span{color:var(--muted);font-size:13px}
  tr.det td{background:var(--bg);white-space:normal}
  .dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 18px;padding:4px 2px}
  .dl div{font-size:12.5px} .dl b{color:var(--muted);font-weight:600;margin-right:6px}
  /* cards (mobile) */
  .cards{display:none}
  @media (max-width:820px){
    .tablewrap{display:none}
    .cards{display:grid;gap:10px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .card .who{font-weight:700;font-size:15px}
    .card .row2{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
    .card .amt{font-variant-numeric:tabular-nums}
    .search{max-width:none}
  }
</style>
</head>
<body class="amt-hide">
<header>
  <div class="bar">
    <h1>배차일보 <span style="color:var(--muted);font-weight:500;font-size:12px">샘플</span></h1>
    <div class="tabs">
      <button data-view="ledger" class="on">배차대장</button>
      <button data-view="summary">요약</button>
    </div>
    <span class="grow"></span>
    <input class="date" type="date" id="dfrom" title="시작일">
    <span style="color:var(--muted)">~</span>
    <input class="date" type="date" id="dto" title="종료일">
    <input class="search" id="q" placeholder="검색 — 화주·지역·차량·컨번호·B/L (예: 청주SDI)">
    <label class="chk"><input type="checkbox" id="amt"> 금액표시</label>
    <button class="btn" id="csv">CSV</button>
    <button class="btn" id="reset">초기화</button>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div class="meta" id="meta"></div>
  <div id="ledger">
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="cards" id="cards"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div id="summary" style="display:none">
    <div class="bar" style="padding:0 0 10px">
      <span style="color:var(--muted)">기준</span>
      <select id="grpby">
        <option value="2">차량번호</option>
        <option value="0">날짜</option>
        <option value="5">화주</option>
        <option value="4">청구처</option>
        <option value="9">선사</option>
        <option value="24">구분(자/용차)</option>
      </select>
      <span style="color:var(--muted);font-size:12.5px">현재 필터·검색 상태 그대로 집계</span>
    </div>
    <div class="tablewrap"><table id="stbl"><thead></thead><tbody></tbody></table></div>
  </div>
</main>
<script src="data.js"></script>
<script>
const D=window.__DISPATCH__, COL=D.columns, LAB=D.labels, ROWS=D.rows;
const idx=Object.fromEntries(COL.map((c,i)=>[c,i]));
const won=n=>n==null||n===''?'':Number(n).toLocaleString('ko-KR');

// ---- ISO 6346 컨테이너 체크디짓 ----
const CV={A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
function cntrCheck(s){
  s=(s||'').toString().toUpperCase().replace(/\s+/g,'');
  if(!/^[A-Z]{4}[0-9]{7}$/.test(s)) return 'na';
  let sum=0; for(let i=0;i<10;i++){const c=s[i];const v=i<4?CV[c]:+c;sum+=v*Math.pow(2,i);}
  let cd=sum%11; if(cd===10)cd=0;
  return cd===+s[10]?'ok':'bad';
}
function cntrCell(v){
  if(v==null||v==='') return '';
  const parts=String(v).split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  return parts.map(p=>{const st=cntrCheck(p);const sym=st==='ok'?'✓':st==='bad'?'✕':'';
    const cls=st;return `<span class="b">${esc(p)}</span>${sym?`<span class="cbadge ${cls}">${sym}</span>`:''}`;}).join('<br>');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 상태 ----
const FILTER_COLS=[['io','수출입'],['div','구분'],['size','사이즈'],['type','타입'],['line','선사'],['billto','청구처']];
const state={q:'',from:'',to:'',sort:{col:0,dir:1},filters:{},page:1,per:120,view:'ledger'};
FILTER_COLS.forEach(([k])=>state.filters[k]=new Set());

// 날짜 범위 기본값
const dates=ROWS.map(r=>r[0]).filter(Boolean).sort();
document.getElementById('dfrom').value=dates[0];
document.getElementById('dto').value=dates[dates.length-1];
state.from=dates[0]; state.to=dates[dates.length-1];

// ---- 필터 UI ----
const fWrap=document.getElementById('filters');
FILTER_COLS.forEach(([key,label])=>{
  const ci=idx[key];
  const vals=[...new Set(ROWS.map(r=>r[ci]).map(v=>v==null?'(빈값)':String(v)))].sort((a,b)=>a.localeCompare(b,'ko'));
  const d=document.createElement('div');d.className='fdrop';
  d.innerHTML=`<button class="btn">${label} <span class="cnt"></span> ▾</button>
    <div class="fmenu"><div class="tools"><a data-all>전체</a><a data-none>해제</a></div>
    ${vals.map(v=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join('')}</div>`;
  fWrap.appendChild(d);
  const btn=d.querySelector('button'),menu=d.querySelector('.fmenu');
  btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.fmenu.open').forEach(m=>m!==menu&&m.classList.remove('open'));menu.classList.toggle('open');};
  menu.onclick=e=>e.stopPropagation();
  d.querySelector('[data-all]').onclick=()=>{menu.querySelectorAll('input').forEach(c=>c.checked=false);state.filters[key].clear();sync();};
  d.querySelector('[data-none]').onclick=()=>{state.filters[key]=new Set(vals);menu.querySelectorAll('input').forEach(c=>c.checked=true);sync();};
  menu.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?state.filters[key].add(c.value):state.filters[key].delete(c.value);sync();});
  d._refresh=()=>{const n=state.filters[key].size;d.querySelector('.cnt').textContent=n?`(${n})`:'';};
});
document.body.onclick=()=>document.querySelectorAll('.fmenu.open').forEach(m=>m.classList.remove('open'));

// ---- 필터링 ----
function passFilters(r){
  for(const [key] of FILTER_COLS){const s=state.filters[key];if(s.size){const v=r[idx[key]];if(!s.has(v==null?'(빈값)':String(v)))return false;}}
  return true;
}
const SEARCH_COLS=['shipper','addr','billto','vno','cntr','bl','do','load','unload','line'].map(k=>idx[k]);
function passSearch(r){
  if(!state.q)return true;
  const terms=state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hay=SEARCH_COLS.map(i=>r[i]==null?'':String(r[i]).toLowerCase()).join(' ');
  return terms.every(t=>hay.includes(t));
}
function passDate(r){const d=r[0];if(!d)return true;return (!state.from||d>=state.from)&&(!state.to||d<=state.to);}
function filtered(){
  let a=ROWS.filter(r=>passDate(r)&&passFilters(r)&&passSearch(r));
  const {col,dir}=state.sort;
  a.sort((x,y)=>{let u=x[col],v=y[col];if(u==null)return 1;if(v==null)return -1;
    if(typeof u==='number'&&typeof v==='number')return (u-v)*dir;return String(u).localeCompare(String(v),'ko')*dir;});
  return a;
}

// ---- 렌더: 배차대장 ----
const SHOW=[['date','날짜'],['io','수출입'],['vno','차량'],['div','구분'],['shipper','화주'],['billto','청구처'],['load','상차지'],['unload','하차지'],['spec','규격'],['cntr','컨번호'],['bl','B/L'],['charge','청구'],['pay','하불']];
const AMT=new Set(['charge','pay']);
function renderLedger(rows){
  const thead=document.querySelector('#tbl thead');
  thead.innerHTML='<tr>'+SHOW.map(([k,l])=>`<th data-c="${idx[k]}" class="${AMT.has(k)?'amt num':''}">${l}</th>`).join('')+'</tr>';
  thead.querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=+th.dataset.c;state.sort.dir=(state.sort.col===c?-state.sort.dir:1);state.sort.col=c;render();});
  const start=(state.page-1)*state.per, pageRows=rows.slice(start,start+state.per);
  const tb=document.querySelector('#tbl tbody');
  tb.innerHTML=pageRows.map((r,i)=>{
    const cells=SHOW.map(([k])=>{
      const v=r[idx[k]];
      if(k==='io')return `<td><span class="pill io-${v}">${v==='I'?'수입':v==='O'?'수출':esc(v)}</span></td>`;
      if(k==='cntr')return `<td class="cntr">${cntrCell(v)}</td>`;
      if(k==='div')return `<td class="div-${esc(v)}">${esc(v)}</td>`;
      if(AMT.has(k))return `<td class="amt num">${won(v)}</td>`;
      return `<td>${esc(v)}</td>`;
    }).join('');
    return `<tr data-ri="${start+i}">${cells}</tr>`;
  }).join('');
  tb.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>toggleDetail(tr,rows[+tr.dataset.ri]));
  // cards
  document.getElementById('cards').innerHTML=pageRows.map(r=>{
    return `<div class="card"><div class="top"><span class="who">${esc(r[idx.shipper])}</span>
      <span class="pill io-${r[idx.io]}">${r[idx.io]==='I'?'수입':'수출'}</span></div>
      <div class="row2"><span>📅 ${esc(r[idx.date])} ${esc(r[idx.time]||'')}</span><span>🚛 ${esc(r[idx.vno])} (${esc(r[idx.div])})</span><span>${esc(r[idx.spec])}</span></div>
      <div class="row2"><span>${esc(r[idx.load])} → ${esc(r[idx.unload])}</span></div>
      <div class="row2 cntr">${cntrCell(r[idx.cntr])}</div>
      <div class="row2 amt"><span>청구 ${won(r[idx.charge])}</span><span>하불 ${won(r[idx.pay])}</span></div></div>`;
  }).join('');
  // foot
  const pages=Math.max(1,Math.ceil(rows.length/state.per));
  document.getElementById('foot').innerHTML=
    `<button class="btn" ${state.page<=1?'disabled':''} id="prev">이전</button>
     <span>${state.page} / ${pages}</span>
     <button class="btn" ${state.page>=pages?'disabled':''} id="next">다음</button>`;
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  if(pv)pv.onclick=()=>{state.page--;render();scrollTo(0,0);};
  if(nx)nx.onclick=()=>{state.page++;render();scrollTo(0,0);};
}
function toggleDetail(tr,r){
  const nx=tr.nextElementSibling;
  if(nx&&nx.classList.contains('det')){nx.remove();return;}
  const extra=[['time','시간'],['chassis','샤시'],['addr','주소'],['tel','전화'],['do','D/O'],['seal','봉인/자가통관'],['tare','테어'],['bonded','메모(보세근거)'],['memo','비고'],['etc','기타']];
  const td=`<tr class="det"><td colspan="${SHOW.length}"><div class="dl">${extra.map(([k,l])=>`<div><b>${l}</b>${esc(r[idx[k]])}</div>`).join('')}</div></td></tr>`;
  tr.insertAdjacentHTML('afterend',td);
}

// ---- 렌더: 요약 ----
function renderSummary(rows){
  const gi=+document.getElementById('grpby').value;
  const m=new Map();
  for(const r of rows){const key=r[gi]==null?'(빈값)':String(r[gi]);
    const o=m.get(key)||{n:0,c:0,p:0};o.n++;o.c+=+r[idx.charge]||0;o.p+=+r[idx.pay]||0;m.set(key,o);}
  const arr=[...m.entries()].sort((a,b)=>b[1].n-a[1].n);
  const tot=arr.reduce((s,[,o])=>({n:s.n+o.n,c:s.c+o.c,p:s.p+o.p}),{n:0,c:0,p:0});
  const th=document.querySelector('#stbl thead');
  th.innerHTML=`<tr><th>${LAB[gi]}</th><th class="num">건수</th><th class="num amt">청구 합계</th><th class="num amt">하불 합계</th></tr>`;
  document.querySelector('#stbl tbody').innerHTML=
    `<tr style="font-weight:700"><td>합계 (${arr.length}종)</td><td class="num">${tot.n.toLocaleString()}</td><td class="num amt">${won(tot.c)}</td><td class="num amt">${won(tot.p)}</td></tr>`+
    arr.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${o.n.toLocaleString()}</td><td class="num amt">${won(o.c)}</td><td class="num amt">${won(o.p)}</td></tr>`).join('');
}

// ---- 메타/공통 ----
function render(){
  const rows=filtered();
  const c=rows.reduce((s,r)=>s+(+r[idx.charge]||0),0), p=rows.reduce((s,r)=>s+(+r[idx.pay]||0),0);
  document.getElementById('meta').innerHTML=
    `<span><b>${rows.length.toLocaleString()}</b> 건</span>`+
    `<span class="amt">청구 <b>${won(c)}</b></span><span class="amt">하불 <b>${won(p)}</b></span>`+
    `<span>전체 ${ROWS.length.toLocaleString()}건 중</span>`;
  if(state.view==='ledger')renderLedger(rows); else renderSummary(rows);
  fWrap.querySelectorAll('.fdrop').forEach(d=>d._refresh&&d._refresh());
}
function sync(){state.page=1;render();}

// 검색/날짜/토글
let qt;document.getElementById('q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();sync();},180);};
document.getElementById('dfrom').onchange=e=>{state.from=e.target.value;sync();};
document.getElementById('dto').onchange=e=>{state.to=e.target.value;sync();};
document.getElementById('amt').onchange=e=>document.body.classList.toggle('amt-hide',!e.target.checked);
document.getElementById('grpby').onchange=render;
document.getElementById('reset').onclick=()=>{
  state.q='';document.getElementById('q').value='';
  FILTER_COLS.forEach(([k])=>state.filters[k].clear());
  fWrap.querySelectorAll('input').forEach(c=>c.checked=false);
  state.from=dates[0];state.to=dates[dates.length-1];
  document.getElementById('dfrom').value=state.from;document.getElementById('dto').value=state.to;
  sync();
};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  state.view=b.dataset.view;
  document.getElementById('ledger').style.display=state.view==='ledger'?'':'none';
  document.getElementById('summary').style.display=state.view==='summary'?'':'none';
  render();
});
// CSV (현재 필터 결과)
document.getElementById('csv').onclick=()=>{
  const rows=filtered();
  const head=SHOW.map(([,l])=>l);
  const body=rows.map(r=>SHOW.map(([k])=>{let v=r[idx[k]];v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));
  const blob=new Blob(['﻿'+[head.join(','),...body].join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='배차일보_'+state.from+'_'+state.to+'.csv';a.click();
};

render();
</script>
</body>
</html>
