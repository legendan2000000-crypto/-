<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYSS 영업 대시보드</title>
<style>
  :root{
    --bg:#0f1420; --card:#161d2c; --line:#26304a; --txt:#e6ebf5; --sub:#93a0bd;
    --acc:#4c8dff; --good:#37c98b; --bad:#ff6b6b; --warn:#f3b13b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:16px;margin:0 12px 0 0;font-weight:700}
  select,input,button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
  button{cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);font-weight:600}
  .sub{color:var(--sub)}
  main{padding:20px;max-width:1200px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .l{color:var(--sub);font-size:12px}
  .kpi .v{font-size:22px;font-weight:700;margin-top:4px}
  .kpi .d{font-size:12px;margin-top:2px}
  .up{color:var(--good)} .down{color:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
  .card h2{font-size:14px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--sub);font-weight:600;position:sticky;top:0;background:var(--card)}
  .scroll{overflow:auto;max-height:420px}
  .muted{color:var(--sub);font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .pill.ok{color:var(--good);border-color:#1f5c44}
  .pill.err{color:var(--bad);border-color:#5c2020}
  .pill.warn{color:var(--warn);border-color:#5c4a1f}
  details{margin-top:6px}
  pre{background:#0b0f18;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12px;color:#c7d2e8}
  .bar{fill:var(--acc)} .bar.py{fill:#334162}
  .axis{stroke:var(--line)} .lbl{fill:var(--sub);font-size:10px}
  .line{fill:none;stroke:var(--warn);stroke-width:2}
  .dot{fill:var(--warn)}
  .tc-row{display:grid;grid-template-columns:190px 1fr 190px;gap:10px;align-items:center;margin:7px 0}
  .tc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .tc-barwrap{background:#0e1524;border-radius:6px;height:20px;overflow:hidden}
  .tc-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--good));border-radius:6px;min-width:2px}
  .tc-val{font-size:12px;white-space:nowrap;text-align:right}
  @media(max-width:640px){ .tc-row{grid-template-columns:110px 1fr;} .tc-val{grid-column:2;text-align:left} }
  .empty{padding:24px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>KYSS 영업 대시보드</h1>
  <span id="status" class="pill">연결 확인 중…</span>
  <label class="sub">영업사원
    <input id="rep" list="repList" placeholder="이름으로 검색… (예: 홍길동)" autocomplete="off" style="min-width:240px">
    <datalist id="repList"></datalist>
  </label>
  <span id="repStatus" class="pill">이름 입력</span>
  <label class="sub">연도
    <select id="year"></select>
  </label>
  <label class="sub">월
    <select id="month">
      <option value="">전체(연간)</option>
    </select>
  </label>
  <button class="primary" id="load">조회</button>
  <button id="reload-reps" title="영업사원 목록 새로고침">↻</button>
  <span id="hint" class="muted"></span>
</header>

<main>
  <div id="kpis" class="kpis"></div>

  <div class="card">
    <h2><span id="chartTitle">월별</span> 매출 · 이익 추이 <span id="chartsub" class="muted"></span></h2>
    <div id="chart"><div class="empty">영업사원을 선택하고 [조회]를 누르세요.</div></div>
  </div>

  <div class="card">
    <h2>상위 10 업체 (매출)</h2>
    <div id="topCorp"><div class="empty">조회하면 표시됩니다.</div></div>
  </div>

  <div class="card">
    <h2>업체별 현황 (전체)</h2>
    <div id="byCorp" class="scroll"><div class="empty">—</div></div>
  </div>

  <div class="card">
    <h2>청구처별 미수 현황</h2>
    <div id="unpaid" class="scroll"><div class="empty">—</div></div>
  </div>

  <div class="card">
    <h2>진단 (첫 실행 시 실제 응답 확인용)</h2>
    <div id="diag" class="muted">조회하면 각 API 응답 상태가 표시됩니다.</div>
  </div>
</main>

<script>
const won = n => (n==null||isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const pct = n => (n==null||isNaN(n)) ? '-' : n.toFixed(1)+'%';
const $ = s => document.querySelector(s);

async function jget(url){ const r = await fetch(url); return r.json(); }

// 연도 셀렉트 채우기
(function(){
  const y = new Date().getFullYear(), sel = $('#year');
  for(let i=y;i>=y-4;i--){ const o=document.createElement('option'); o.value=i; o.textContent=i; sel.appendChild(o); }
  const ms = $('#month');
  for(let m=1;m<=12;m++){ const o=document.createElement('option'); o.value=String(m).padStart(2,'0'); o.textContent=m+'월'; ms.appendChild(o); }
})();

let DEFAULTS = { branch:'', pic:'' };
let REPS = [];

// 검색창 입력값("이름 · 부서 (코드)" 또는 이름/코드)에서 담당자코드 뽑기
function resolveRepCode(){
  const v = ($('#rep').value||'').trim();
  if(!v) return '';
  const m = v.match(/\(([^)]+)\)\s*$/);              // 끝의 (코드)
  if(m) return m[1];
  const exact = REPS.filter(r=>r.name===v);           // 이름 완전일치
  if(exact.length===1) return exact[0].code;
  const byCode = REPS.find(r=>String(r.code)===v);    // 코드 직접입력
  if(byCode) return byCode.code;
  const part = REPS.filter(r=>r.name && r.name.includes(v)); // 부분일치 1건
  if(part.length===1) return part[0].code;
  return v;                                            // 그 외엔 입력값을 코드로 시도
}
function repLabel(r){ return `${r.name}${r.dept? ' · '+r.dept:''}${r.code? ' ('+r.code+')':''}`; }

// 이름 검색 상태 배지. verbose=true면 조회 직전 검증(불가 시 false 반환)
function validateRep(verbose){
  const el = $('#repStatus'); const v = ($('#rep').value||'').trim();
  const set = (cls,txt)=>{ if(el){ el.className='pill'+(cls?' '+cls:''); el.textContent=txt; } };
  if(!v){ set('', '이름 입력'); return false; }
  if(!REPS.length){ set('warn', '목록없음·코드 직접입력'); return true; } // 목록 못 불러온 경우 코드로 시도 허용
  const m = v.match(/\(([^)]+)\)\s*$/);
  let rep = m ? REPS.find(r=>String(r.code)===m[1]) : null;
  if(!rep) rep = REPS.find(r=>r.name===v) || REPS.find(r=>String(r.code)===v);
  if(!rep){ const part = REPS.filter(r=>r.name && r.name.includes(v));
    if(part.length===1) rep=part[0];
    else if(part.length>1){ set('warn', `여러 명(${part.length})·선택 필요`); return false; }
  }
  if(rep){ set('ok', `✔ ${rep.name}${rep.dept? ' · '+rep.dept:''} 준비완료`); return true; }
  set('err', '✖ 확인불가 (오타?)'); return false;
}

async function init(){
  const st = await jget('/api/status');
  const el = $('#status');
  if(st.loggedIn){ el.className='pill ok'; el.textContent='로그인됨'; }
  else{ el.className='pill err'; el.textContent='로그인 실패'; $('#hint').textContent='.env 계정을 확인하세요 (아래 진단 참고)'; showDiag({login:st.login}); }
  DEFAULTS = st.defaults || DEFAULTS;
  await loadReps();
}

async function loadReps(fresh){
  const dl = $('#repList'); dl.innerHTML = '';
  const r = await jget('/api/reps' + (fresh===true ? '?fresh=1' : ''));
  REPS = (r.reps || []);
  if(!REPS.length){
    $('#hint').textContent = '임직원 목록을 못 불러왔습니다 - 진단 참고 (이름 대신 코드 직접 입력 가능)';
    showDiag({reps:r.diag});
    if(DEFAULTS.pic) $('#rep').value = DEFAULTS.pic;
    validateRep(false);
    return;
  }
  for(const rep of REPS){
    const o = document.createElement('option');
    o.value = repLabel(rep);           // datalist 후보 = "이름 · 부서 (코드)"
    dl.appendChild(o);
  }
  const def = REPS.find(x=>String(x.code)===String(DEFAULTS.pic));
  if(def) $('#rep').value = repLabel(def);
  $('#hint').textContent = `임직원 ${REPS.length}명 · 이름을 입력하면 자동완성 (source: ${r.source})`;
  validateRep(false);
}

async function loadReport(){
  const pic = resolveRepCode(), year = $('#year').value, month = $('#month').value;
  if(!pic){ $('#hint').textContent = '먼저 영업사원 이름을 선택/입력하세요.'; return; }
  if(!validateRep(true)){ return; }
  $('#chart').innerHTML = '<div class="empty">불러오는 중…</div>';
  const rep = $('#rep').value || pic;
  const rpt = await jget(`/api/report?pic=${encodeURIComponent(pic)}&year=${year}&month=${month}&branch=${encodeURIComponent(DEFAULTS.branch||'')}`);
  renderKpis(rpt, rep);
  renderChart(rpt);
  renderTopCorp(rpt.byCorp);
  renderTable('#byCorp', rpt.byCorp);
  renderTable('#unpaid', rpt.unpaid);
  showDiag({note:rpt.note, report:rpt.diag});
  const scope = rpt.month ? `${rpt.year}년 ${Number(rpt.month)}월` : `${rpt.year}년 전체`;
  $('#hint').textContent = rpt.note ? rpt.note : `조회 완료 · ${scope} · 이익율 ${pct(rpt.kpi?.per)}`;
}

function renderKpis(r, repLabel){
  const k = r.kpi || {};
  const cards = [
    ['매출(청구)', won(k.bill)+'원'],
    ['하불', won(k.pay)+'원'],
    ['이익', won(k.profit)+'원'],
    ['이익율', pct(k.per)],
    ['물동량(컨테이너)', won(k.cnt)+'개'],
  ];
  $('#kpis').innerHTML = cards.map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')
    + `<div class="kpi"><div class="l">대상 / 연도</div><div class="v" style="font-size:15px">${r.year}</div><div class="d muted">${repLabel}</div></div>`;
  $('#chartsub').textContent = k.latestMonth ? `· 최신 ${k.latestMonth.month}: 이익 ${won(k.latestMonth.profit)} (${pct(k.latestMonth.per)})` : '';
}

function renderChart(r){
  const single = !!r.month;
  $('#chartTitle').textContent = single ? `${r.year}년 ${Number(r.month)}월` : `${r.year}년 월별`;
  const m = r.monthly || [];
  if(!m.length){ $('#chart').innerHTML = '<div class="empty">이 조건의 데이터가 없습니다. (담당자/연월 확인 또는 아래 진단 참고)</div>'; return; }
  const W=1120,H=300,pad=44, base=H-pad;
  const max=Math.max(1,...m.map(x=>Math.max(x.bill,x.pay,x.profit)));
  const y = v => base - (v/max)*(base-pad);
  const gap=(W-pad*2)/m.length;
  // 한 달만: 매출·하불·이익 3개 막대 / 여러 달: 매출·이익 2개 막대(나란히)
  const series = single
    ? [['매출','var(--acc)',x=>x.bill],['하불','#5b6b8c',x=>x.pay],['이익','#37c98b',x=>x.profit]]
    : [['매출','var(--acc)',x=>x.bill],['이익','#37c98b',x=>x.profit]];
  const n=series.length;
  const slot=Math.min(gap*0.8, 70*n);           // 그룹 폭(막대 커지지 않게 상한)
  const bw=Math.min(slot/n-4, 46);
  const maxPer=Math.max(10,...m.map(x=>x.per));
  const yp=v=>base-(v/maxPer)*(base-pad);
  let bars='',line='',dots='',labels='',vlab='';
  m.forEach((x,i)=>{
    const cx=pad+gap*i+gap/2;
    const groupW=bw*n+4*(n-1); let bx=cx-groupW/2;
    series.forEach(([nm,color,fn])=>{
      const v=fn(x), yy=y(v);
      bars+=`<rect x="${bx}" y="${yy}" width="${bw}" height="${base-yy}" rx="3" fill="${color}"><title>${x.month} ${nm} ${won(v)}</title></rect>`;
      if(m.length<=6) vlab+=`<text class="lbl" x="${bx+bw/2}" y="${yy-4}" text-anchor="middle">${won(v)}</text>`;
      bx+=bw+4;
    });
    const py=yp(x.per);
    line+=(i?'L':'M')+cx+' '+py+' ';
    dots+=`<circle class="dot" cx="${cx}" cy="${py}" r="3"><title>${x.month} 이익율 ${pct(x.per)}</title></circle>`;
    if(single) dots+=`<text class="lbl" x="${cx}" y="${py-8}" text-anchor="middle" fill="#f3b13b">이익율 ${pct(x.per)}</text>`;
    labels+=`<text class="lbl" x="${cx}" y="${base+16}" text-anchor="middle">${x.month.slice(5)}</text>`;
  });
  const legend = single ? '막대: 매출·하불·이익 / 점: 이익율' : '막대: 매출(파랑)·이익(초록) / 선: 이익율(노랑)';
  $('#chart').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" width="100%">
      <line class="axis" x1="${pad}" y1="${base}" x2="${W-pad}" y2="${base}"/>
      ${bars}${single?'':`<path class="line" d="${line}"/>`}${dots}${labels}${vlab}
      <text class="lbl" x="${pad}" y="16">${legend}</text>
    </svg>`;
}

function renderTopCorp(byCorp){
  const box = $('#topCorp');
  const top = (byCorp||[]).slice(0,10);
  if(!top.length){ box.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  const max = Math.max(1, ...top.map(x=>x.매출||0));
  box.innerHTML = top.map((x,i)=>{
    const w = Math.max(1, (x.매출||0)/max*100);
    return `<div class="tc-row">
      <div class="tc-name" title="${x.업체}">${i+1}. ${x.업체}</div>
      <div class="tc-barwrap"><div class="tc-bar" style="width:${w}%"></div></div>
      <div class="tc-val">${won(x.매출)}원 <span class="muted">· 이익 ${won(x.이익)} (${(x.이익율||0).toFixed(1)}%)</span></div>
    </div>`;
  }).join('');
}

function renderTable(sel, rows){
  const box = $(sel);
  if(!rows || !rows.length){ box.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  // 표시 컬럼: 이름/코드류 먼저, 그다음 금액류. 최대 8개.
  const keys = Object.keys(rows[0]).filter(k=>k!=='_raw');
  const nameKeys = keys.filter(k=>/NM|NAME|명|CD|CODE|MONTH|YM|업체|거래처|청구처|담당|일자/i.test(k));
  const isPer = k => /(율|per|%)/i.test(k);
  const isNum = k => !isPer(k) && /AMOUNT|AMT|PROFIT|BILL|PAY|CNT|UNPAID|미수|이익|매출|하불|물동량|금액|건수/i.test(k);
  const numKeys  = keys.filter(k=>isNum(k) && !nameKeys.includes(k));
  const cols = [...new Set([...nameKeys, ...numKeys, ...keys])].slice(0,8);
  const fmt = (k,v) => isPer(k) ? (v===''||v==null?'':(+v).toFixed(1)+'%') : (isNum(k)? won(Number(String(v).replace(/[, ]/g,''))) : (v??''));
  const head = '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  const body = rows.slice(0,100).map(r=>'<tr>'+cols.map(c=>`<td>${fmt(c, r[c])}</td>`).join('')+'</tr>').join('');
  box.innerHTML = `<table>${head}${body}</table>`;
}

function showDiag(obj){
  $('#diag').innerHTML = '<pre>'+JSON.stringify(obj,null,2)+'</pre>';
}

$('#load').onclick = loadReport;
$('#reload-reps').onclick = ()=>loadReps(true);
$('#rep').addEventListener('input', ()=>validateRep(false));
init();
</script>
</body>
</html>
