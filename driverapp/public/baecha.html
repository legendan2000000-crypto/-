<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국양로지텍 배차일보</title>
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<style>
  :root{
    --bg:#eef1f6; --panel:#fff; --line:#e2e7ef; --text:#1a2233; --muted:#6a7789;
    --accent:#2563eb; --accent-soft:#e8f0fe; --ok:#15a34a; --bad:#dc2626; --warn:#e08600; --gray:#9aa6b6;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 1px 2px rgba(20,30,50,.05);
    --io-i:#0369a1; --io-i-bg:#e0f2fe; --io-o:#9333ea; --io-o-bg:#f3e8ff;
    --usr:#0d7a53; --usr-bg:#e5f6ee;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e131e;--panel:#161c29;--line:#28303f;--text:#e6ebf3;--muted:#8b97ad;
      --accent:#5b8cff;--accent-soft:#1b2740;--io-i-bg:#0c2233;--io-o-bg:#241033;--usr-bg:#0e2a1f;--shadow:none;--gray:#5a6675;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px}
  .bar h1{font-size:16px;margin:0 6px 0 0;font-weight:800;white-space:nowrap}
  .tabs{display:flex;gap:3px;background:var(--bg);border-radius:9px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px}
  .tabs button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
  .grow{flex:1}
  input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  button.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700}
  button.btn:hover{border-color:var(--accent);color:var(--accent)}
  button.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.btn.pri:hover{color:#fff;filter:brightness(1.05)}
  button.btn.sm{padding:4px 9px;font-size:12.5px}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  main{padding:12px 14px 60px;max-width:1760px;margin:0 auto}
  .view{display:none} .view.on{display:block}
  .meta{color:var(--muted);font-size:12.5px;margin:2px 2px 10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .meta b{color:var(--text)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  /* 당일배차 */
  .dayhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .dayhead .d{font-size:20px;font-weight:800}
  .dayhead .dow{color:var(--muted);font-weight:600;font-size:14px}
  .tablewrap{overflow:auto;border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--panel);z-index:5;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.act{white-space:nowrap}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:700}
  .io-I{color:var(--io-i);background:var(--io-i-bg)} .io-O{color:var(--io-o);background:var(--io-o-bg)}
  .tag-user{color:var(--usr);background:var(--usr-bg);padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:800;margin-left:6px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .cbadge{margin-left:5px;font-size:11px;font-weight:800}
  .cbadge.ok{color:var(--ok)} .cbadge.bad{color:var(--bad)} .cbadge.warn{color:var(--warn)} .cbadge.na{color:var(--gray)}
  .amt-hide .amt{display:none !important}
  .empty{padding:44px 16px;text-align:center;color:var(--muted)}
  .empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
  /* form */
  .formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px;padding:16px}
  .fld{display:flex;flex-direction:column;gap:4px;position:relative}
  .fld label{font-size:12px;color:var(--muted);font-weight:700}
  .fld.wide{grid-column:1/-1}
  .fld .hint{font-size:11.5px;color:var(--muted)}
  .conf-low{background:#fff8e1;border-color:var(--warn)!important}
  @media (prefers-color-scheme:dark){.conf-low{background:#2a2410}}
  .sug{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,50,.18);margin-top:2px;max-height:230px;overflow:auto;display:none}
  .sug.open{display:block}
  .sug div{padding:7px 10px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .sug div:hover,.sug div.hi{background:var(--accent-soft)}
  .sug div small{color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .chips button:hover{border-color:var(--accent);color:var(--accent)}
  .chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .formsec{grid-column:1/-1;font-weight:800;font-size:13px;color:var(--accent);border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
  .formsec small{color:var(--muted);font-weight:600;margin-left:6px}
  .pill.miss{color:var(--warn);background:#fff4e0;font-weight:800}
  @media (prefers-color-scheme:dark){.pill.miss{background:#2a2010}}
  .cntrbox{display:flex;flex-direction:column;gap:6px}
  .cntrrow{display:flex;gap:8px;align-items:center}
  .cntrrow input{flex:1;text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
  .cntrmsg{font-size:12px;font-weight:700;min-width:150px}
  .cntrmsg.ok{color:var(--ok)} .cntrmsg.bad{color:var(--bad)} .cntrmsg.warn{color:var(--warn)} .cntrmsg.na{color:var(--gray)}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
  .drop.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .paste{width:100%;min-height:70px;resize:vertical}
  .formbar{display:flex;gap:10px;justify-content:flex-end;padding:0 16px 16px;flex-wrap:wrap}
  .note{margin:0 16px 12px;padding:9px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:12.5px}
  .note.warn{background:#fff4e0;color:#a35a00}
  @media (prefers-color-scheme:dark){.note.warn{background:#2a2010;color:#e0a75a}}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .fdrop{position:relative}
  .fmenu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,50,.16);padding:8px;min-width:170px;max-height:300px;overflow:auto;display:none}
  .fmenu.open{display:block}
  .fmenu label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
  .fmenu label:hover{background:var(--bg)}
  .cards{display:none}
  @media (max-width:860px){
    .tablewrap table{display:none}
    .cards{display:grid;gap:10px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
    .card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .card .who{font-weight:800;font-size:15px}
    .card .r{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
    .formgrid{grid-template-columns:1fr 1fr}
    .fld.wide{grid-column:1/-1}
  }
  /* 폰: 오더 입력 폼을 한 열로(가로 한 화면에 딱 맞게) */
  @media (max-width:600px){
    .bar{padding:8px 10px}
    main{padding:10px 10px 60px}
    .formgrid{grid-template-columns:1fr;gap:10px;padding:12px}
    .formbar{padding:0 12px 14px}
    .formbar .btn{flex:1;padding:11px 12px;font-size:15px}
    .cntrrow{flex-wrap:wrap}
    .cntrrow input{flex:1 1 100%}
    .cntrmsg{min-width:0;flex:1 1 100%}
    .sug{max-height:180px}
  }
</style><style>#apptabs{position:sticky;top:0;z-index:100;display:flex;gap:4px;background:var(--panel);border-bottom:2px solid var(--line);padding:5px 10px;box-shadow:var(--shadow)}.apptab{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:15px;padding:8px 16px;border-radius:9px;cursor:pointer}.apptab.on{background:var(--accent);color:#fff}#app-dispatch header{top:44px}#quoteframe,#shipframe{width:100%;border:0;display:block;height:calc(100vh - 46px)}@media(max-width:600px){.apptab{font-size:14px;padding:7px 11px}}</style>
<div id="apptabs"><button class="apptab on" data-app="dispatch">🚚 배차일보</button><button class="apptab" data-app="quote">🧮 내륙운송 견적</button><button class="apptab" data-app="ship">🚢 전국선박검색</button></div><div id="app-dispatch">
<header>
  <div class="bar">
    <h1>배차일보</h1>
    <div class="tabs" id="tabs">
      <button data-v="day" class="on">당일배차</button>
      <button data-v="input">＋ 입력</button>
      <button data-v="sum">요약</button>
      <button data-v="find">조회</button>
    </div>
    <span class="grow"></span>
    <label class="chk"><input type="checkbox" id="amt"> 금액</label>
    <span id="storeinfo" class="chk" style="cursor:default"></span>
  </div>
</header>
<main>
  <!-- 당일배차 -->
  <section class="view on" id="v-day">
    <div class="dayhead">
      <button class="btn sm" id="dprev">◀</button>
      <input type="date" id="dsel">
      <button class="btn sm" id="dnext">▶</button>
      <button class="btn sm" id="dlast">최근일</button>
      <span class="d" id="dbig"></span><span class="dow" id="ddow"></span>
      <span class="grow"></span>
      <span class="meta" id="daymeta" style="margin:0"></span>
      <button class="btn pri" id="addBtn">＋ 새 배차</button>
    </div>
    <div class="panel tablewrap">
      <table id="dtbl"><thead></thead><tbody></tbody></table>
      <div class="cards" id="dcards"></div>
      <div class="empty" id="dempty" style="display:none"><b>이 날짜에 배차가 없습니다</b>＋ 새 배차로 추가하세요</div>
    </div>
  </section>

  <!-- 입력 -->
  <section class="view" id="v-input">
    <div class="panel" style="margin-bottom:14px">
      <div style="padding:14px 16px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>빠른 입력</b><span class="hint" style="color:var(--muted)">메신저 내용을 그대로 붙여넣거나, D/O·PDF를 올리면 자동으로 아래 폼을 채웁니다.</span>
      </div>
      <div style="padding:0 16px 14px;display:grid;grid-template-columns:1fr;gap:10px">
        <textarea class="paste" id="pasteBox" placeholder="여기에 메신저 내용을 붙여넣고 [자동 파싱] — 필터 없이 통째로 붙여도 됩니다."></textarea>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn pri" id="parseBtn">자동 파싱</button>
          <div class="drop grow" id="drop">📄 D/O · PDF · 워드(.docx) · 이미지 파일을 여기에 끌어다 놓기 (또는 클릭)</div>
          <input type="file" id="file" accept=".pdf,.docx,image/*,.txt" style="display:none">
        </div>
        <div id="parseInfo" class="hint" style="color:var(--muted)"></div>
      </div>
    </div>
    <div class="panel">
      <div class="note" id="editNote" style="display:none"></div>
      <div class="formgrid" id="form"></div>
      <div class="formbar">
        <span class="grow hint" style="color:var(--muted)" id="formStatus"></span>
        <button class="btn" id="cancelForm">취소</button>
        <button class="btn" id="clearForm">폼 비우기</button>
        <button class="btn pri" id="saveBtn">저장</button>
      </div>
    </div>
  </section>

  <!-- 요약 -->
  <section class="view" id="v-sum">
    <div class="meta">
      <span>기준</span>
      <select id="grpby">
        <option value="vno">차량번호</option><option value="date">날짜</option>
        <option value="shipper">화주</option><option value="billto">청구처</option>
        <option value="line">선사</option><option value="div">구분(자/용차)</option>
      </select>
      <input type="date" id="sfrom" class="sm"><span>~</span><input type="date" id="sto">
      <span class="hint">기간 내 집계</span>
    </div>
    <div class="panel tablewrap"><table id="stbl"><thead></thead><tbody></tbody></table></div>
  </section>

  <!-- 조회 -->
  <section class="view" id="v-find">
    <div class="bar" style="padding:0 0 10px">
      <input id="q" placeholder="검색 — 화주·지역·차량·컨번호·B/L (예: 청주SDI)" style="flex:1;max-width:380px">
      <input type="date" id="ffrom"><span>~</span><input type="date" id="fto">
      <button class="btn sm" id="csv">CSV</button>
      <button class="btn sm" id="aliasBtn">별칭 관리</button>
      <button class="btn sm" id="freset">초기화</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="meta" id="fmeta"></div>
    <div class="panel tablewrap"><table id="ftbl"><thead></thead><tbody></tbody></table><div class="cards" id="fcards"></div></div>
    <div style="text-align:center;padding:14px" id="ffoot"></div>
  </section>

<script>

    DC.forEach((c,k)=>{const j=CI[k],v=o[j];o[j]=(v==null?null:DI[c][v]);});return o;});}
const LKEY='bcm_entries_v1', AKEY='bcm_alias_v1';

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW=['일','월','화','수','목','금','토'];

//    (같은 날 같은 B/L·같은 컨목록·같은 화주 … 전부 동일 → 서로 다른 오더가 아니라 실수로 겹친 것)
function dedupeUserExact(persist){
  const seen=new Set(); const out=[]; let removed=0;
  for(const u of USER){
    const key=COL.map(c=>String(u[c]==null?'':u[c])).join('')+''+(u._over||'')+''+(u._deleted?1:0);
    if(seen.has(key)){removed++;continue;}
    seen.add(key); out.push(u);
  }
  if(removed){USER=out; if(persist){try{localStorage.setItem(LKEY,JSON.stringify(USER));}catch(e){}}}
  return removed;
}
window.dedupeUserExact=dedupeUserExact;
const __dupOnLoad=dedupeUserExact(true);   // 파일 열 때 기존 저장분에서 완전중복 자동 제거
function rebuild(){
  // USER 항목은 신규이거나, 기존(base) 건을 덮어쓰는 수정본(_over)일 수 있다.
  const over=new Set(USER.filter(u=>u._over).map(u=>u._over));           // 수정/삭제된 base id

        .concat(USER.filter(u=>!u._deleted));                            // 삭제표식 제외
  buildMasters();buildTokens();
}

/* ============ ISO 6346 ============ */
const CV={A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
function cntrState(s){ // '' na warn ok bad
  s=(s||'').toString().toUpperCase().replace(/\s+/g,'');
  if(s.length===0)return {st:'',msg:''};
  if(s.length<=10)return {st:'na',msg:'입력 중…'};
  if(!/^[A-Z]{4}[0-9]{7}$/.test(s))return {st:'warn',msg:'형식: 영문4 + 숫자7'};
  let sum=0;for(let i=0;i<10;i++){const c=s[i];const v=i<4?CV[c]:+c;sum+=v*Math.pow(2,i);}
  let cd=sum%11;if(cd===10)cd=0;
  return cd===+s[10]?{st:'ok',msg:'✓ 정상'}:{st:'bad',msg:'✕ 번호를 다시 확인하세요'};
}
function cntrCell(v){
  if(v==null||v==='')return '';
  return String(v).split(/[\n,]/).map(x=>x.trim()).filter(Boolean).map(p=>{
    const {st}=cntrState(p);const sym=st==='ok'?'✓':st==='bad'?'✕':st==='warn'?'!':'';
    return `<span class="mono">${esc(p)}</span>${sym?`<span class="cbadge ${st}">${sym}</span>`:''}`;
  }).join('<br>');
}

/* ============ 마스터 ============ */
let M={};
function topKey(map){let best=null,n=-1;for(const [k,c] of map)if(c>n){n=c;best=k;}return best;}
function buildMasters(){
  const veh=new Map(),shp=new Map(),lines=new Map(),loads=new Map(),unloads=new Map(),bills=new Map();
  const inc=(m,k)=>{if(k==null||k==='')return;m.set(k,(m.get(k)||0)+1);};
  for(const r of ALL){
    // vehicle
    if(r.vno!=null&&r.vno!==''){const key=String(r.vno);let v=veh.get(key);if(!v){v={key,div:new Map(),chassis:new Map(),n:0};veh.set(key,v);}v.n++;inc(v.div,r.div);inc(v.chassis,r.chassis);}
    // shipper
    if(r.shipper){let s=shp.get(r.shipper);if(!s){s={name:r.shipper,addr:new Map(),tel:new Map(),bill:new Map(),n:0};shp.set(r.shipper,s);}s.n++;inc(s.addr,r.addr);inc(s.tel,r.tel);inc(s.bill,r.billto);}
    inc(lines,r.line);inc(loads,r.load);inc(unloads,r.unload);inc(bills,r.billto);
  }
  M={veh,shp,lines,loads,unloads,bills};
}
function vehInfo(key){const v=M.veh.get(String(key));if(!v)return null;
  return {div:topKey(v.div),chassis:[...v.chassis.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]),n:v.n};}
function shpInfo(name){const s=M.shp.get(name);if(!s)return null;
  return {addrs:[...s.addr.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]),tel:topKey(s.tel),bill:topKey(s.bill),n:s.n};}
// 화주 정규화: 대소문자·공백 무시, 1글자 오타 허용 → 마스터 표준명 반환(없으면 null)
function canonShipper(name){
  if(!name)return null;if(M.shp.has(name))return name;
  const n=name.toLowerCase().replace(/\s/g,'');
  for(const k of M.shp.keys()){if(k.toLowerCase().replace(/\s/g,'')===n)return k;}
  if(name.length>=5)for(const k of M.shp.keys()){if(k.length===name.length){let d=0;for(let i=0;i<k.length;i++)if(k[i]!==name[i]){if(++d>1)break;}if(d===1)return k;}} // 짧은 이름 오교정 방지(5자+)
  return null;
}

/* ============ 지역토큰 + 검색토큰(별칭 곱) ============ */
function regionTokens(addr){
  if(!addr)return [];
  const out=new Set();
  for(const w of String(addr).split(/\s+/)){
    const m=w.match(/^(.+?)(특별자치시|특별자치도|특별시|광역시|시|군|구|읍|면|동|리|도)$/);
    if(m&&m[1].length>=1){out.add(m[1]);out.add(w);}
  }
  return [...out];
}
let TOK=new Map(); // _id -> lowercased blob
function buildTokens(){
  TOK=new Map();
  for(const r of ALL){
    const regs=new Set(regionTokens(r.addr));
    // 지역 별칭 확장
    for(const rg of [...regs]){(ALIAS.region[rg]||[]).forEach(a=>regs.add(a));}
    const names=new Set([r.shipper].filter(Boolean));
    (ALIAS.shipper[r.shipper]||[]).forEach(a=>names.add(a));
    const parts=[r.date,r.vno,r.shipper,r.billto,r.line,r.load,r.unload,r.bl,r.do,r.cntr,r.addr];
    for(const n of names)for(const rg of regs){parts.push(rg+''+n);parts.push(n+''+rg);}
    parts.push(...regs,...names);
    TOK.set(r._id,parts.filter(Boolean).join(' ').toLowerCase());
  }
}
function matchQuery(r,q){
  if(!q)return true;
  const blob=TOK.get(r._id)||'';
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>blob.includes(t));
}

function copyDispatch(id){
  const r=ALL.find(x=>x._id===id); if(!r)return;
  const v=x=>{x=(x==null?'':String(x)).trim();return x||'-';};
  const txt=['[배차]',
    '상차지 : '+v(r.load),
    '사이즈 : '+v(specOf(r)),
    '화주 : '+v(r.shipper),
    '도착지 : '+v(r.unload||r.addr),
    '연락처 : '+v(r.tel),
    '시간 : '+v(r.time)
  ].join('\n');
  copyText(txt,'배차정보 복사됨 — 카톡에 붙여넣기 하세요 ✓');
}
function copyText(t,msg){
  const ok=()=>toast(msg||'복사됨 ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));}
  else fallbackCopy(t,ok);
}
function fallbackCopy(t,ok){
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const done=document.execCommand('copy');document.body.removeChild(ta);if(done){ok();return;}}catch(e){}
  window.prompt('아래 내용을 길게 눌러 전체 복사하세요',t);
}

}

function saveMemoInline(id,val){
  val=String(val==null?'':val).replace(/ /g,' ').replace(/\s+$/,'');
  const r=ALL.find(x=>x._id===id); if(!r) return;
  if(String(r._src)==='user'){
    const u=USER.find(x=>x._id===id); if(!u) return;
    if(String(u.memo==null?'':u.memo)===val) return;
    u.memo=val;
  } else {
    let u=USER.find(x=>x._over===id && !x._deleted);
    if(u){ if(String(u.memo==null?'':u.memo)===val) return; u.memo=val; }
    else{ const e={_src:'user',_id:'u'+Date.now(),_over:id,_deleted:false}; COL.forEach(c=>e[c]=r[c]); e.memo=val; USER.push(e); }

/* 자동완성 */
function suggest(f,inp,box){
  const q=(inp.value||'').trim().toLowerCase();
  let items=[];
  if(f.k==='vno'){
    const arr=[...M.veh.values()];
    items=arr.filter(v=>v.key.toLowerCase().includes(q)).sort((a,b)=>b.n-a.n).slice(0,8)
      .map(v=>({val:v.key,sub:`${topKey(v.div)||''} · ${v.n}건`}));
  }else if(f.k==='shipper'){
    items=[...M.shp.values()].filter(s=>s.name.toLowerCase().includes(q)).sort((a,b)=>b.n-a.n).slice(0,8)
      .map(s=>({val:s.name,sub:`${s.n}건`}));
  }else{
    const m=M[f.src];if(m)items=[...m.keys()].filter(k=>String(k).toLowerCase().includes(q)).slice(0,8).map(k=>({val:k,sub:''}));
  }
  if(!items.length||!q){box.classList.remove('open');box._items=null;return;}
  box._items=items;box._hi=0;
  box.innerHTML=items.map((it,i)=>`<div data-i="${i}" data-val="${esc(it.val)}" class="${i===0?'hi':''}">${esc(it.val)}<small>${esc(it.sub)}</small></div>`).join('');
  box.classList.add('open');
  box.querySelectorAll('div').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(f.k,d.dataset.val);box.classList.remove('open');});
}
function sugHi(box,dir){
  if(!box._items||!box._items.length)return;
  box._hi=(box._hi+dir+box._items.length)%box._items.length;
  box.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('hi',i===box._hi));
  const el=box.querySelector('.hi');if(el)el.scrollIntoView({block:'nearest'});
}
function sugKey(e,k,box){
  if(!box.classList.contains('open')||!box._items)return;
  if(e.key==='ArrowDown'){e.preventDefault();sugHi(box,1);}
  else if(e.key==='ArrowUp'){e.preventDefault();sugHi(box,-1);}
  else if(e.key==='Enter'){
    const i=box._hi>=0?box._hi:0;e.preventDefault();pick(k,box._items[i].val);box.classList.remove('open');
  }
  else if(e.key==='Tab'){
    const i=box._hi>=0?box._hi:0;pick(k,box._items[i].val);box.classList.remove('open');
  }
  else if(e.key==='Escape'){box.classList.remove('open');}
}
function pick(k,val){

}

/* ============ 파싱 (메신저/파일) ============ */
function parseText(text){
  const res={};const info=[];
  const cntrs=[...new Set([...text.matchAll(/\b([A-Z]{4}\d{7})\b/g)].map(m=>m[1]))];
  if(cntrs.length){const allok=cntrs.every(c=>cntrState(c).st==='ok');
    res.cntr={v:cntrs.join(', '),c:allok?1:0.5};info.push(`컨번호 ${cntrs.length}${allok?'':' (검증 필요)'}`);}
  const tel=text.match(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/);if(tel){res.tel={v:tel[0],c:1};info.push('연락처');}
  const bt=text.match(/청구처\s*[:\-]?\s*([가-힣A-Za-z0-9()·&]{2,})/);if(bt){res.billto={v:bt[1],c:.85};info.push('청구처');}
  const cg=text.match(/청구\s*[가액]\s*[:\-]?\s*([\d,]{4,})\s*원?/);if(cg){res.charge={v:cg[1].replace(/,/g,''),c:.8};info.push('청구가');}
  const REGION=/(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주|경상[남북]도|전라[남북]도|충청[남북]도|경기도|강원도|제주도)\s*[가-힣]{1,4}(시|군|구)\s*[가-힣0-9\s\-()]{2,40}/;
  // '도착지/하차지/납품처' 라벨 옆 주소를 최우선(공급받는자·공급자 주소보다 우선)
  const dz=text.match(/(도착지|하차지|납품처|인도지|배송지|납품지|하치장)\s*[:\-]?\s*([^\n]{0,90})/);
  const am=(dz&&dz[2].match(REGION))||text.match(REGION);
  if(am){let a=am[0].replace(/\s+/g,' ').trim();
    a=a.split(/\s0?1[016789][-.\s]?\d/)[0].trim();   // 전화번호 앞에서 자름
    a=a.replace(/\s+[A-Za-z].*$/,'').trim();          // 뒤쪽 영문코드(DWS 등) 제거
    a=a.split(/\s*(특이사항|비고|담당|연락처|청구|출하|도착|품명|수량|현장|송장|주소|시간)/)[0].trim(); // 뒤 항목 앞에서 자름
    res.addr={v:a,c:.6};info.push('주소');}
  // ── 날짜: 명시(YYYY-M-D / M월D일 / M.D) → 상대(오늘·내일·모레·다음주 화요일 …)
  // 오더는 항상 '오늘'을 기준으로 상대날짜 계산(붙여넣은 대화의 날짜 헤더는 무시)
  const refD=new Date();
  const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const hasRel=/다음주|담주|다담주|이번주|금주|내일|모레|글피|오늘|요일/.test(text); // '차주'(車主)는 제외
  let dateVal=null,dateConf=1,dateNote='';
  const yr=(text.match(/(20\d{2})\s*년/)||[])[1]||new Date().getFullYear();
  const pad2=x=>String(x).padStart(2,'0');
  // ⬆ 현장 도착/납품일 우선: 'M/D일' 형태 또는 도착·납품·상차·현장·하차 키워드 근처 날짜(발행일보다 우선)
  let deliv=null;
  const sd=text.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*일/);
  if(sd)deliv=[+sd[1],+sd[2]];
  if(!deliv){const kb=text.match(/(도착|납품|상차|현장|하차|입고|배송|납기)[^\d]{0,12}(\d{1,2})\s*[월\/\.]\s*(\d{1,2})/);if(kb)deliv=[+kb[2],+kb[3]];}
  if(!deliv){const ka=text.match(/(\d{1,2})\s*[월\/\.]\s*(\d{1,2})\s*일?[^\d]{0,8}(도착|납품|상차|하차|입고|현장)/);if(ka)deliv=[+ka[1],+ka[2]];}
  const dm=text.match(/(20\d{2})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  const mdk=text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(deliv&&!hasRel&&deliv[0]>=1&&deliv[0]<=12&&deliv[1]>=1&&deliv[1]<=31){dateVal=`${yr}-${pad2(deliv[0])}-${pad2(deliv[1])}`;dateConf=.7;dateNote=' (현장/납품일)';}
  else if(dm&&!hasRel){dateVal=`${dm[1]}-${pad2(dm[2])}-${pad2(dm[3])}`;}
  else if(mdk&&!hasRel){dateVal=`${yr}-${pad2(mdk[1])}-${pad2(mdk[2])}`;}
  else if(!hasRel){const m2=text.match(/\b(\d{1,2})[.\/](\d{1,2})\b/);
    if(m2)dateVal=`${yr}-${pad2(m2[1])}-${pad2(m2[2])}`;}
  if(hasRel){
    const DK={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};let rd=null;
    if(/모레/.test(text))rd=addD(refD,2);
    else if(/내일/.test(text))rd=addD(refD,1);
    else if(/글피/.test(text))rd=addD(refD,3);
    else if(/오늘/.test(text))rd=new Date(refD);
    const relText=text.replace(/\d{1,2}\s*월\s*\d{1,2}\s*일\s*[월화수목금토일]\s*요일/g,' '); // 날짜헤더 제거
    const wk=relText.match(/(이번주|금주|다음주|담주|다담주)\s*([월화수목금토일])\s*요일/); // 주+요일 우선
    const bare=relText.match(/([월화수목금토일])\s*요일/);
    const wm=wk?{word:wk[1],dow:wk[2]}:(bare?{word:'',dow:bare[1]}:null);
    if(wm){const tdow=DK[wm.dow],cur=refD.getDay();
      if(wm.word){const mon=addD(refD,-(cur===0?6:cur-1));              // 이번주 월요일
        const wkn=/다담주/.test(wm.word)?14:(/다음주|담주/.test(wm.word)?7:0);
        rd=addD(mon,wkn+(tdow===0?6:tdow-1));
      }else{let g=(tdow-cur+7)%7;if(g===0)g=7;rd=addD(refD,g);}          // 주 지정 없으면 다음 해당요일
    }
    if(rd){dateVal=fmtD(rd);dateConf=0.55;dateNote=` (오늘 ${refD.getMonth()+1}/${refD.getDate()} 기준)`;}
  }
  if(dateVal){res.date={v:dateVal,c:dateConf};info.push('날짜'+(dateConf<0.75?' ⚠확인'+dateNote:''));}
  // ── 시간: 오전/오후 N시(반/N분) 우선, 없으면 HH:MM
  const kt=text.match(/(오전|오후|아침|저녁|밤|새벽|낮)?\s*(\d{1,2})\s*시\s*(반|(\d{1,2})\s*분)?/);
  if(kt){let h=+kt[2];const ap=kt[1]||'';
    if(/오후|저녁|밤|낮/.test(ap)&&h<12)h+=12;
    if(/오전|아침|새벽/.test(ap)&&h===12)h=0;
    const mn=kt[3]==='반'?30:(kt[4]?+kt[4]:0);
    res.time={v:String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0'),c:ap?0.85:0.6};info.push('시간');
  }else{const tm=text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(tm){res.time={v:tm[0].padStart(5,'0'),c:1};info.push('시간');}}
  // ── 수출입: 키워드 확장(들어온/입항 → 수입, 나가는/출항 → 수출)
  if(/수입|import|반입|들어온|들어옴|입항|양하/i.test(text)){res.io={v:'I',c:/수입|반입/.test(text)?1:0.7};}
  else if(/수출|export|반출|나가는|출항|선적/i.test(text)){res.io={v:'O',c:/수출|반출/.test(text)?1:0.7};}
  // ── 수량: "컨테이너 2대", "2대", "2개"
  const qm=text.match(/컨테이너\s*(\d{1,2})\s*대?/)||text.match(/(\d{1,2})\s*대(?!리)/)||text.match(/(\d{1,2})\s*개/);
  if(qm){const q=+qm[1];if(q>=1&&q<=30){res._qty=q;if(q>1)info.push(`수량 ${q}대`);}}
  const sz=text.match(/\b(20|40|45)\b/);if(sz){res.size={v:sz[1],c:.6};}
  const tp=text.match(/\b(RF|RH|HC|OT|FR|DV|GP)\b/i)||text.match(/(리퍼|오픈탑|플랫)/);
  if(tp){const map={RF:'RE',RH:'RE',리퍼:'RE',OT:'OT',오픈탑:'OT',FR:'FR',플랫:'FR'};res.type={v:map[tp[1].toUpperCase?tp[1].toUpperCase():tp[1]]||(sz&&sz[1]?'':'H'),c:.5};}
  // 차량 뒷4자리: 마스터에 있는 4자리
  const nums=[...text.matchAll(/\b(\d{4})\b/g)].map(m=>m[1]).filter(n=>M.veh.has(n));
  if(nums.length){res.vno={v:nums[0],c:.7};info.push('차량후보');}
  // ① 명시 라벨 "화주 XXX" / "화주:XXX" / "화주명 XXX" 최우선 (마스터로 정규화)
  const shLabel=text.match(/화주(?:명)?\s*[:\-]?\s*([가-힣A-Za-z0-9()·&]{2,})/);
  if(shLabel){const c=canonShipper(shLabel[1]);res.shipper={v:c||shLabel[1],c:c?.9:.8};}
  // ② 마스터 매칭 (라벨 없을 때, 대소문자 무시·긴 이름 우선)
  if(!res.shipper){const T=text.toUpperCase();
    for(const s of [...M.shp.keys()].sort((a,b)=>b.length-a.length)){if(s&&s.length>=2&&T.includes(s.toUpperCase())){res.shipper={v:s,c:.8};break;}}}
  // ③ 마스터에 없는 새 화주: 짧은 오더면 앞쪽 명사를 후보로 (단, 터미널·경로·잡토큰 제외)
  if(!res.shipper){
    const STOP=/^(내일|모레|오늘|글피|이번주|금주|다음주|담주|차주|다담주|오전|오후|아침|저녁|밤|새벽|낮|수입|수출|반입|반출|들어온|들어옴|들어온거|입항|출항|선적|도착|출발|컨테이너|컨|박스|피트|기준|담당|화주|화주명|안녕하세요|안녕하세용|있어요|있음)$/;
    const isTerm=t=>t.split(/[-→~>]/).some(x=>x&&(M.loads.has(x)||M.unloads.has(x)));
    const toks=text.replace(/[()\[\]:·,\/\n]/g,' ').split(/\s+/).filter(Boolean);
    if(toks.length<=6){
      for(const t of toks){
        if(t.length<2||STOP.test(t))continue;
        if(/^\d/.test(t)||/\d(대|개|시|분|피트|월|일|톤)/.test(t))continue; // 수량/시간/날짜 제외
        if(/^[A-Z]{4}\d{7}$/.test(t)||/요일$/.test(t))continue;               // 컨번호/요일 제외
        if(/입니다$|건$|도착|출발/.test(t)||isTerm(t))continue;               // 서술어·터미널·경로 제외
        const c=canonShipper(t);res.shipper={v:c||t,c:c?.7:.45};break;
      }
    }
  }
  // 상차/하차: 라벨(상차/하차) 뒤에 오는 터미널 우선, 없으면 첫 매칭
  const findTerm=(map,labels,useFallback)=>{
    for(const lb of labels){const gi=text.indexOf(lb);if(gi>=0){const seg=text.slice(gi,gi+18);
      for(const t of map.keys()){if(t&&t.length>=2&&seg.includes(t))return t;}}}
    if(useFallback){for(const t of map.keys()){if(t&&t.length>=2&&text.includes(t))return t;}}
    return null;
  };
  const ld=findTerm(M.loads,['상차','상차지','싣','출발'],true);
  if(ld)res.load={v:ld,c:.6};
  const ul=findTerm(M.unloads,['하차','하차지','하치','도착','→'],false); // 하차 라벨 있을 때만(없으면 주소=하차지)
  if(ul)res.unload={v:ul,c:.5};
  const bl=text.match(/\b[A-Z]{3,4}[A-Z0-9]{6,}\b/);if(bl&&!cntrs.includes(bl[0])){res.bl={v:bl[0],c:.5};}
  return {res,info};
}
function applyParse(text){
  if(!editing)editing={_src:'user',_id:null,date:selDate,io:'I',div:'자차'};
  if(typeof window.__tabRowFill==='function' && window.__tabRowFill(text)){ buildFormDom(); document.getElementById('saveBtn').textContent='저장'; return; }
  const {res,info}=parseText(text);
  for(const k in res){if(k[0]==='_')continue;editing[k]=res[k].v;}
  if(res.vno){const vi=vehInfo(res.vno.v);if(vi&&vi.div)editing.div=vi.div;}
  if(res.shipper){const si=shpInfo(res.shipper.v);if(si){if(si.addrs[0]&&!res.addr)editing.addr=si.addrs[0];if(si.tel&&!res.tel)editing.tel=si.tel;if(si.bill&&!res.billto)editing.billto=si.bill;}}
  const qty=(res._qty&&res._qty>1)?res._qty:1;
  if(qty>1)editing._qty=qty;              // 저장 시 N건 등록
  buildFormDom();
  document.getElementById('saveBtn').textContent=qty>1?`${qty}건 등록`:'저장';
  // 확신 낮은 필드 노랑
  for(const k in res){if(k[0]==='_')continue;if(res[k].c<0.75){const el=document.querySelector(`#form [data-k="${k}"]`);if(el)el.classList.add('conf-low');}}
  const qtyMsg=qty>1?` <span style="color:var(--accent);font-weight:700">· 저장하면 ${qty}건이 오더장에 등록됩니다 (디테일 나중에)</span>`:'';
  document.getElementById('parseInfo').innerHTML=info.length?`파싱됨: ${info.join(' · ')} <span style="color:var(--warn)">— 노란 칸은 확인 필요</span>${qtyMsg}`:'인식된 값이 없습니다. 직접 입력하세요.';
}

// .docx(워드) 텍스트 추출 — 외부 라이브러리 없이 ZIP 파싱 + 브라우저 내장 압축해제
async function readDocx(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-22-65536;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('ZIP 형식 아님');
  let cd=dv.getUint32(eocd+16,true);const n=dv.getUint16(eocd+10,true);
  let off=-1,csize=0,method=8;
  for(let e=0;e<n&&dv.getUint32(cd,true)===0x02014b50;e++){
    const m=dv.getUint16(cd+10,true),cs=dv.getUint32(cd+20,true);
    const fnl=dv.getUint16(cd+28,true),efl=dv.getUint16(cd+30,true),cml=dv.getUint16(cd+32,true);
    const lo=dv.getUint32(cd+42,true),name=td.decode(u8.subarray(cd+46,cd+46+fnl));
    if(name==='word/document.xml'){off=lo;csize=cs;method=m;}
    cd+=46+fnl+efl+cml;
  }
  if(off<0)throw new Error('document.xml 없음');
  const lfnl=dv.getUint16(off+26,true),lefl=dv.getUint16(off+28,true);
  const start=off+30+lfnl+lefl,comp=u8.subarray(start,start+csize);
  let bytes=comp;
  if(method===8){const ds=new DecompressionStream('deflate-raw');
    bytes=new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer());}
  let xml=td.decode(bytes).replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\s*\/?>/g,'\n');
  return xml.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,'&');
}
// ===== Google Vision OCR (REST, API키 방식 — 함수 배포 불필요) =====
const OCR_KEY='AIzaSyBB3L82xpVH8XHGI8Zk2gfjhkdI5kblRkY';
async function ocrRun(base64){
  const url='https://vision.googleapis.com/v1/images:annotate?key='+OCR_KEY;
  const body={requests:[{image:{content:base64},features:[{type:'DOCUMENT_TEXT_DETECTION'}]}]};
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok){let m=resp.status;try{const j=await resp.json();m=(j.error&&j.error.message)||m;}catch(e){}throw new Error('Vision '+m);}
  const j=await resp.json();const r=j.responses&&j.responses[0];
  if(r&&r.error)throw new Error(r.error.message||'Vision 오류');
  return (r&&r.fullTextAnnotation&&r.fullTextAnnotation.text)||'';
}
async function ocrPdfPage(pdf,n){
  const pg=await pdf.getPage(n), vp=pg.getViewport({scale:2});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  return cv.toDataURL('image/jpeg',0.85).split(',')[1];
}
function ocrFileB64(f){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){res(String(rd.result).split(',')[1]);};rd.onerror=rej;rd.readAsDataURL(f);});}
async function ocrApply(getB64,info){
  try{
    info.textContent='🔎 OCR 판독 중 (Google Vision)…';
    const text=await ocrRun(await getB64());
    if(text&&text.replace(/\s/g,'').length>=5){
      document.getElementById('pasteBox').value=text.trim(); applyParse(text);
      info.innerHTML='✅ OCR 판독 완료 — 노란 칸은 확인해 주세요.';
    }else info.innerHTML='<span style="color:var(--warn)">OCR 결과가 비었습니다. 더 선명한 파일이거나 텍스트로 붙여넣어 주세요.</span>';
  }catch(e){ info.innerHTML='<span style="color:var(--bad)">OCR 실패: '+esc(e.message||e)+'</span>'; }
}
async function handleFile(f){
  if(!f)return;const info=document.getElementById('parseInfo');
  if(f.type==='text/plain'||f.name.endsWith('.txt')){const t=await f.text();document.getElementById('pasteBox').value=t;applyParse(t);return;}
  if(f.name.toLowerCase().endsWith('.docx')){
    info.textContent='워드 문서 읽는 중…';
    try{const t=await readDocx(await f.arrayBuffer());document.getElementById('pasteBox').value=t.trim();
      if(t.replace(/\s/g,'').length<5)info.innerHTML='<span style="color:var(--warn)">문서에서 글자를 찾지 못했습니다.</span>';
      else applyParse(t);
    }catch(e){info.innerHTML='<span style="color:var(--bad)">워드 처리 실패: '+esc(e.message)+'</span>';}
    return;
  }
  if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){
    if(!window.pdfjsLib){info.innerHTML='<span style="color:var(--warn)">PDF 판독기(pdf.js)를 불러오지 못했습니다. 온라인 상태에서 다시 시도하거나 텍스트를 붙여넣으세요.</span>';return;}
    info.textContent='PDF 텍스트 추출 중…';
    try{
      const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      let txt='';for(let p=1;p<=Math.min(pdf.numPages,3);p++){const pg=await pdf.getPage(p);
        const c=await pg.getTextContent();txt+=c.items.map(i=>i.str).join(' ')+'\n';
        try{const ann=await pg.getAnnotations();for(const a of ann){       // FreeText/메모 주석의 값도 포함
          const s=(a.contentsObj&&a.contentsObj.str)||a.contents||'';if(s)txt+='\n'+s;}}catch(e){}
      }
      document.getElementById('pasteBox').value=txt.trim();
      const _ok=/[A-Z]{4}\d{7}/.test(txt)||/[가-힣]/.test(txt);   // 컨번호 또는 한글이 잡히면 정상
      if(_ok){ applyParse(txt); }
      else { await ocrApply(()=>ocrPdfPage(pdf,1), info); }        // 글자 깨짐/스캔 → Google Vision OCR
    }catch(e){info.innerHTML='<span style="color:var(--bad)">PDF 처리 실패: '+esc(e.message)+'</span>';}
    return;
  }
  if(f.type.startsWith('image/')){
    await ocrApply(()=>ocrFileB64(f), info);   // 이미지 → Google Vision OCR
    return;
  }
  info.textContent='지원하지 않는 형식입니다.';
}

function renderSum(){
  const gi=document.getElementById('grpby').value;
  const f=document.getElementById('sfrom').value,t=document.getElementById('sto').value;
  let rows=ALL.filter(r=>(!f||r.date>=f)&&(!t||r.date<=t));
  const m=new Map();
  for(const r of rows){const key=r[gi]==null||r[gi]===''?'(빈값)':String(r[gi]);const o=m.get(key)||{n:0,c:0,p:0};o.n++;o.c+=+r.charge||0;o.p+=+r.pay||0;m.set(key,o);}
  const arr=[...m.entries()].sort((a,b)=>b[1].n-a[1].n);
  const tot=arr.reduce((s,[,o])=>({n:s.n+o.n,c:s.c+o.c,p:s.p+o.p}),{n:0,c:0,p:0});
  const lab={vno:'차량',date:'날짜',shipper:'화주',billto:'청구처',line:'선사',div:'구분'}[gi];
  document.querySelector('#stbl thead').innerHTML=`<tr><th>${lab}</th><th class="num">건수</th><th class="num amt">청구</th><th class="num amt">하불</th></tr>`;
  document.querySelector('#stbl tbody').innerHTML=`<tr style="font-weight:800"><td>합계 (${arr.length}종)</td><td class="num">${tot.n.toLocaleString()}</td><td class="num amt">${won(tot.c)}</td><td class="num amt">${won(tot.p)}</td></tr>`+
    arr.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${o.n.toLocaleString()}</td><td class="num amt">${won(o.c)}</td><td class="num amt">${won(o.p)}</td></tr>`).join('');
}

const FSHOW=[['date','날짜'],['io','수출입'],['vno','차량'],['shipper','화주'],['load','상차'],['unload','하차'],['spec','규격'],['cntr','컨번호'],['bl','B/L'],['charge','청구'],['pay','하불']];
const FILTER_COLS=[['io','수출입'],['div','구분'],['size','사이즈'],['line','선사']];
const fstate={q:'',from:'',to:'',page:1,per:100,filters:{}};

function buildFilterUI(){
  const w=document.getElementById('filters');w.innerHTML='';
  FILTER_COLS.forEach(([key,label])=>{
    const vals=[...new Set(ALL.map(r=>r[key]).map(v=>v==null||v===''?'(빈값)':String(v)))].sort();
    const d=document.createElement('div');d.className='fdrop';
    d.innerHTML=`<button class="btn sm">${label} ▾</button><div class="fmenu">${vals.map(v=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label>`).join('')}</div>`;
    w.appendChild(d);const btn=d.querySelector('button'),menu=d.querySelector('.fmenu');
    btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.fmenu.open').forEach(m=>m!==menu&&m.classList.remove('open'));menu.classList.toggle('open');};
    menu.onclick=e=>e.stopPropagation();
    menu.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?fstate.filters[key].add(c.value):fstate.filters[key].delete(c.value);fstate.page=1;renderFind();});
  });
}
document.body.onclick=()=>document.querySelectorAll('.fmenu.open').forEach(m=>m.classList.remove('open'));
function findRows(){
  return ALL.filter(r=>{
    if(fstate.from&&r.date<fstate.from)return false;if(fstate.to&&r.date>fstate.to)return false;
    for(const [k] of FILTER_COLS){const s=fstate.filters[k];if(s.size&&!s.has(r[k]==null||r[k]===''?'(빈값)':String(r[k])))return false;}
    return matchQuery(r,fstate.q);
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function renderFind(){
  const rows=findRows();
  const c=rows.reduce((s,r)=>s+(+r.charge||0),0),p=rows.reduce((s,r)=>s+(+r.pay||0),0);
  document.getElementById('fmeta').innerHTML=`<span><b>${rows.length.toLocaleString()}</b>건</span><span class="amt">청구 <b>${won(c)}</b></span><span class="amt">하불 <b>${won(p)}</b></span>`;
  document.querySelector('#ftbl thead').innerHTML='<tr>'+FSHOW.map(([k,l])=>`<th class="${k==='charge'||k==='pay'?'amt num':''}">${l}</th>`).join('')+'</tr>';
  const st=(fstate.page-1)*fstate.per,pg=rows.slice(st,st+fstate.per);
  document.querySelector('#ftbl tbody').innerHTML=pg.map(r=>'<tr>'+FSHOW.map(([k])=>{
    if(k==='io')return `<td><span class="pill io-${r.io}">${r.io==='I'?'수입':r.io==='O'?'수출':esc(r.io)}</span></td>`;
    if(k==='cntr')return `<td>${cntrCell(r.cntr)}</td>`;if(k==='spec')return `<td>${esc(specOf(r))}</td>`;
    if(k==='charge'||k==='pay')return `<td class="amt num">${won(r[k])}</td>`;
    if(k==='shipper')return `<td>${esc(r.shipper)}${srcTag(r)}</td>`;
    return `<td>${esc(r[k])}</td>`;}).join('')+'</tr>').join('');
  document.getElementById('fcards').innerHTML=pg.map(r=>`<div class="card"><div class="top"><span class="who">${esc(r.shipper)}</span><span class="pill io-${r.io}">${r.io==='I'?'수입':'수출'}</span></div><div class="r"><span>${esc(r.date)}</span><span>🚛 ${esc(r.vno)}</span><span>${esc(specOf(r))}</span></div><div class="r"><span>${esc(r.load)} → ${esc(r.unload)}</span></div><div class="r">${cntrCell(r.cntr)}</div></div>`).join('');
  const pages=Math.max(1,Math.ceil(rows.length/fstate.per));
  document.getElementById('ffoot').innerHTML=`<button class="btn sm" ${fstate.page<=1?'disabled':''} id="fp">이전</button> <span class="hint">${fstate.page}/${pages}</span> <button class="btn sm" ${fstate.page>=pages?'disabled':''} id="fn">다음</button>`;
  const fp=document.getElementById('fp'),fn=document.getElementById('fn');
  if(fp)fp.onclick=()=>{fstate.page--;renderFind();};if(fn)fn.onclick=()=>{fstate.page++;renderFind();};
}

  @media (prefers-color-scheme:dark){:root{--bg:#0d151b;--panel:#131f28;--line:#243642;--ink:#e6eef3;--mut:#93a6b3;--accent:#4bc3cd;--soft:#12333a;}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);flex:0 0 auto;flex-wrap:wrap}
  .bar .ttl{font-weight:700;color:var(--ink)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.wait{background:var(--warn)}
  .bar .grow{flex:1}
  .bar .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none;font-weight:600}
  .bar .btn:hover{background:var(--soft)}
  .bar .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #progframe{flex:1 1 auto;width:100%;border:0;display:none;background:var(--bg)}
  #progframe.show{display:block}
  /* 안내 화면 */
  .guide{flex:1 1 auto;overflow:auto;padding:26px 0;display:block}
  .guide.hide{display:none}
  .gwrap{max-width:720px;margin:0 auto;padding:0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:17px}
  .card p{margin:6px 0;font-size:14px}
  .card b{color:var(--ink)}
  .card ul{margin:8px 0;padding-left:20px;color:var(--mut);font-size:13px;line-height:1.8}
  .steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
  .steps li{counter-increment:s;position:relative;padding:6px 0 6px 30px;font-size:14px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:20px;height:20px;background:var(--accent);color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .big{display:inline-block;background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;margin:6px 8px 0 0}
  .big.ghost{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
  .term{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .term span{background:var(--soft);color:var(--accent);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600}
</style>
</head>
<body>

<div class="bar">
  <span class="ttl"><span class="dot wait" id="sdot"></span>전국선박검색</span>
  <span id="sstat">연결 확인 중…</span>
  <span class="grow"></span>
  <button class="btn primary" id="reprobe">🔄 다시 연결</button>
  <a class="btn" href="http://localhost:8737" target="_blank" rel="noopener">↗ 전용 창</a>
</div>

<!-- 프로그램 화면 (연결됐을 때만 src 주입) -->
<iframe id="progframe" title="전국선박검색"></iframe>

<!-- 안내 (기본 표시) -->
<div id="guideView" class="guide">
  <div class="gwrap">
    <div class="card">
      <h2><span class="dot bad" id="gdot"></span><span id="gtitle">선박검색 프로그램을 먼저 켜주세요</span></h2>
      <p>이 탭은 전국 5개 항·13개 터미널의 <b>실시간 선석 스케줄</b>을 조회합니다.
         각 터미널 사이트를 직접 조회하는 방식이라, 아래 <b>로컬 프로그램</b>이 켜져 있어야 합니다.</p>
      <ol class="steps">
        <li><b>전국컨테이너_선박검색.exe</b> 를 더블클릭 (파이썬 설치 불필요)</li>
        <li>검은 창에 <b>"준비 완료 → localhost:8737"</b> 이 뜨면 실행된 것</li>
        <li>아래 <b>연결해서 표 보기</b> 를 누르면 이 화면에 표가 나타납니다</li>
      </ol>
      <div>
        <button class="big" id="retry">🔄 연결해서 표 보기</button>
        <button class="big ghost" id="force">그래도 화면 불러오기</button>
        <a class="big ghost" href="http://localhost:8737" target="_blank" rel="noopener">↗ 새 창으로 열기</a>
      </div>
      <p class="hint" id="hint" style="color:var(--mut);font-size:12.5px;margin-top:12px"></p>
    </div>
    <div class="card">
      <h2>조회 대상 (5개 항 · 13개 터미널)</h2>
      <p><b>부산</b></p>
      <div class="term"><span>PNIT 신항2</span><span>HJNC 신항3</span><span>HPNT 신항4</span><span>BNCT 신항5</span><span>DGT 서컨</span><span>BPT 북항</span><span>PNC 신항1*</span></div>
      <p style="margin-top:10px"><b>평택</b></p><div class="term"><span>PCTC 한진</span><span>PNCT 동방아이포트</span></div>
      <p style="margin-top:10px"><b>인천</b></p><div class="term"><span>iCON 통합(선광·한진·E1·ICT 등)</span></div>
      <p style="margin-top:10px"><b>광양</b></p><div class="term"><span>GWCT 서부</span><span>KITL 허치슨</span></div>
      <p style="margin-top:10px"><b>울산</b></p><div class="term"><span>UNCT 울산신항</span></div>
      <ul>
        <li>* PNC(신항1)은 별도 브라우저 엔진이 필요해 exe 경량판엔 빠져 있습니다(파이썬 실행 시 포함).</li>
        <li>조회기간: 자동 "오늘−2일 ~ 오늘+14일"</li>
        <li>탭 안에 표가 안 뜨면(브라우저 보안) <b>↗ 전용 창</b> 으로는 항상 조회됩니다.</li>
      </ul>
    </div>
  </div>
</div>

<script>
var BASE="http://localhost:8737/";
function $(id){return document.getElementById(id);}
var embedded=false;

function showFrame(){
  $("guideView").classList.add("hide");
  $("progframe").classList.add("show");
  if(!embedded){ embedded=true; $("progframe").src=BASE+"?t="+Date.now(); }
  $("sdot").className="dot ok"; $("sstat").textContent="연결됨 · localhost:8737";
}
function showGuide(state){ // state: 'off' | 'checking'
  $("progframe").classList.remove("show");
  $("guideView").classList.remove("hide");
  if(state==="checking"){ $("sdot").className="dot wait"; $("sstat").textContent="연결 확인 중…"; }
  else { $("sdot").className="dot bad"; $("sstat").textContent="프로그램 꺼짐(또는 브라우저 차단)"; }
}
// localhost:8737 도달 확인 (no-cors, 3초 타임아웃)
function probe(){
  return new Promise(function(res){
    var done=false, t=setTimeout(function(){ if(!done){done=true;res(false);} },3000);
    fetch(BASE+"api/schedule",{mode:"no-cors",cache:"no-store"})
      .then(function(){ if(!done){done=true;clearTimeout(t);res(true);} })
      .catch(function(){ if(!done){done=true;clearTimeout(t);res(false);} });
  });
}
function check(){
  showGuide("checking"); $("hint").textContent="";
  return probe().then(function(ok){
    if(ok){ showFrame(); }
    else { showGuide("off"); $("hint").textContent="연결 실패: 검은 창(exe)이 켜져 있는지 확인하세요. 켜져 있는데도 안 되면 브라우저가 막은 것이니 [그래도 화면 불러오기] 또는 [전용 창]을 쓰세요."; }
    return ok;
  });
}
function forceEmbed(){ embedded=false; showFrame(); $("progframe").onerror=function(){}; }

$("retry").onclick=check;
$("reprobe").onclick=check;
$("force").onclick=forceEmbed;

// 최초 자동 확인
check();
@@ENDSCRIPT@@
</body>
</html>
</script>

    for(var i=0;i<cols.length && i<COLORDER.length;i++){
      var k=COLORDER[i], v=(cols[i]==null?'':String(cols[i]).trim());
      if(v==='') continue;
      if(k==='io') v=normIO(v);
      else if(k==='charge'||k==='pay'||k==='km') v=v.replace(/[^\d.]/g,'');   // 콤마·"원" 제거 → 숫자만
      else if(k==='date') v=normDate2(v);
      else if(k==='vno'){ var f=vehLookup(v); if(f) v=f; }
      if(v!=='') editing[k]=v;
    }
    return true;
  };

  /* ---------- CSV 파싱 (UTF-8 실패 시 EUC-KR 재시도) ---------- */
  function decodeBytes(buf){
    var u=new Uint8Array(buf);
    var txt=new TextDecoder('utf-8',{fatal:false}).decode(u);
    if(txt.indexOf(' ')>=0){ try{ txt=new TextDecoder('euc-kr').decode(u); }catch(e){} }
    return txt.replace(/^﻿/,'');
  }
  function parseCSV(text){
    var rows=[],row=[],cur='',q=false,i=0,c,n;
    for(i=0;i<text.length;i++){c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else{ if(c==='"')q=true;
        else if(c===','){row.push(cur);cur='';}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if(c==='\r'){ /* skip */ }
        else cur+=c; } }
    if(cur!==''||row.length){row.push(cur);rows.push(row);}
    return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
  }

  /* ---------- XLSX 파싱 (네이티브 DecompressionStream, 라이브러리 불필요) ---------- */
  async function inflateRaw(bytes){
    if(!bytes.length) return new Uint8Array();
    var ds=new DecompressionStream('deflate-raw');
    var stream=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function unzip(buf){
    var dv=new DataView(buf), u=new Uint8Array(buf), n=buf.byteLength, i;
    // EOCD 찾기
    var eocd=-1;
    for(i=n-22;i>=0 && i>=n-22-65536;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
    if(eocd<0) throw new Error('xlsx: EOCD 없음');
    var cnt=dv.getUint16(eocd+10,true), cdoff=dv.getUint32(eocd+16,true);
    var files={}, p=cdoff;
    for(var e=0;e<cnt;e++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      var method=dv.getUint16(p+10,true);
      var csize=dv.getUint32(p+20,true);
      var nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
      var lho=dv.getUint32(p+42,true);
      var name=new TextDecoder('utf-8').decode(u.subarray(p+46,p+46+nlen));
      // local header
      var lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
      var dstart=lho+30+lnlen+lelen;
      var comp=u.subarray(dstart,dstart+csize);
      files[name]={method:method,data:comp};
      p+=46+nlen+elen+clen;
    }
    var out={};
    for(var k in files){var f=files[k];
      out[k]= f.method===0 ? f.data : await inflateRaw(f.data);
    }
    return out;
  }
  function colToIdx(ref){var m=/^([A-Z]+)/.exec(ref);if(!m)return 0;var s=m[1],x=0;for(var i=0;i<s.length;i++)x=x*26+(s.charCodeAt(i)-64);return x-1;}
  function xmlText(s){return s.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(+d);});}
  async function parseXLSX(buf){
    var files=await unzip(buf);
    var dec=new TextDecoder('utf-8');
    // sharedStrings
    var sst=[];
    if(files['xl/sharedStrings.xml']){
      var sx=dec.decode(files['xl/sharedStrings.xml']);
      var sis=sx.match(/<si[\s>][\s\S]*?<\/si>/g)||sx.match(/<si\/>/g)||[];
      sst=(sx.match(/<si[\s\S]*?<\/si>|<si\/>/g)||[]).map(function(si){
        var ts=si.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[];
        return ts.map(function(t){return xmlText(t);}).join('');
      });
    }
    // 첫 워크시트 XML 선택
    var sheetName=Object.keys(files).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);}).sort()[0];
    if(!sheetName) throw new Error('xlsx: 시트 없음');
    var sx2=dec.decode(files[sheetName]);
    var rowsXml=sx2.match(/<row\b[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g)||[];
    var rows=[];
    rowsXml.forEach(function(rx){
      var cells=rx.match(/<c\b[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[];
      var arr=[];
      cells.forEach(function(cx){
        var ref=(/r="([A-Z]+\d+)"/.exec(cx)||[])[1]||'';
        var ci=ref?colToIdx(ref):arr.length;
        var t=(/t="([^"]+)"/.exec(cx)||[])[1]||'';
        var val='';
        if(t==='inlineStr'){ var im=/<t[^>]*>([\s\S]*?)<\/t>/.exec(cx); val=im?xmlText('<t>'+im[1]+'</t>'):''; }
        else { var vm=/<v[^>]*>([\s\S]*?)<\/v>/.exec(cx); if(vm){ val=vm[1]; if(t==='s') val=sst[+val]||''; else val=xmlText('<x>'+val+'</x>'); } }
        arr[ci]=val;
      });
      for(var z=0;z<arr.length;z++) if(arr[z]==null) arr[z]='';
      rows.push(arr);
    });
    return rows.filter(function(r){return r.some(function(x){return String(x).trim()!=='';});});
  }

  /* ---------- 파일 → 2차원 배열 ---------- */
  async function readFile(file){
    var buf=await file.arrayBuffer();
    if(/\.xlsx$/i.test(file.name)||/\.xlsm$/i.test(file.name)) return await parseXLSX(buf);
    return parseCSV(decodeBytes(buf));
  }

  function msg(t){document.getElementById('imp-msg').textContent=t||'';}

  async function load(file){
    msg('읽는 중… '+file.name);
    try{
      var rows=await readFile(file);
      if(rows.length<2){ msg('데이터 행이 없습니다.'); return; }
      // 헤더 줄 자동 탐지 (첫 줄이 빈 줄/제목일 수 있음 → 라벨이 가장 많이 맞는 줄)
      var hi=0,bestScore=-1;
      for(var r=0;r<Math.min(rows.length,15);r++){
        var sc=rows[r].map(guessField).filter(Boolean).length;
        if(sc>bestScore){bestScore=sc;hi=r;}
      }
      if(bestScore<3){ msg('헤더 줄을 찾지 못했습니다. 컬럼 제목이 있는 파일인지 확인하세요.'); return; }
      HEAD=rows[hi].map(function(x){return String(x==null?'':x).trim();});
      RAW=rows.slice(hi+1);
      MAP=HEAD.map(guessField);
      renderMap();
      renderSummary();
      document.getElementById('imp-run').disabled=false;
      msg(file.name+' · '+RAW.length+'행 읽음');
    }catch(err){ msg('읽기 실패: '+(err.message||err)); }
  }
  function renderMap(){
    var box=document.getElementById('imp-map');
    var opts='<option value="">— 무시 —</option>'+FIELDS.map(function(f){return '<option value="'+f.k+'">'+f.lab+'</option>';}).join('');
    var h='<div class="imp-maph">열 매칭 <span class="imp-note">(자동 인식됨 · 필요하면 바꾸세요)</span></div><div class="imp-grid">';
    HEAD.forEach(function(hd,i){
      h+='<div class="imp-cell"><div class="imp-col" title="'+esc(hd)+'">'+esc(hd||'(빈 헤더)')+'</div>'
        +'<select data-i="'+i+'">'+opts+'</select></div>';
    });
    h+='</div>';
    box.innerHTML=h;
    box.querySelectorAll('select').forEach(function(s){
      s.value=MAP[+s.dataset.i]||'';
      s.onchange=function(){ MAP[+s.dataset.i]=s.value; renderSummary(); };
    });
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function buildRecords(){
    // 매핑된 열만 사용해 객체 배열 생성
    var recs=RAW.map(function(r){
      var o={};
      MAP.forEach(function(k,i){ if(!k)return; var v=r[i]; if(v==null||String(v).trim()==='')return;
        v=String(v).trim();
        // 엑셀 날짜/시간이 숫자(serial)로 들어오면 변환
        if(k==='date'&&/^\d{4,6}(\.\d+)?$/.test(v)) v=excelDate(parseFloat(v));
        else if(k==='time'&&/^\d*\.\d+$/.test(v)&&parseFloat(v)<1) v=excelTime(parseFloat(v));
        else if(k==='time'&&/^0?\.\d+$/.test(v)) v=excelTime(parseFloat(v));
        o[k]=v;
      });
      if(o.io) o.io=normIO(o.io);
      if(o.vno){ var full=vehLookup(o.vno); if(full) o.vno=full; }   // 약칭 → 풀 차량번호
      return o;
    }).filter(function(o){
      // 유효 레코드만: 컨번호가 있거나, 의미있는 필드가 3개 이상 (제목/구분줄 걸러냄)
      if(o.cntr) return true;
      return Object.keys(o).length>=3;
    });
    return recs;
  }
  function dupKeyOf(o,mode){
    var bl=function(){return (o.bl||'').toUpperCase().replace(/\s+/g,'');};
    if(mode==='bl') return bl();
    if(mode==='bl+date'){ var b=bl(); return b?b+'|'+(o.date||''):''; }
    if(mode==='cntr+date'){ var c=normCntr(o.cntr); return c?c+'|'+(o.date||''):''; }
    return normCntr(o.cntr);
  }
  function consolidate(recs,mode){
    var map={}, order=[], noKey=[];
    recs.forEach(function(o){
      var key=dupKeyOf(o,mode);
      if(!key){ noKey.push(o); return; }            // 키 없으면 개별 유지
      if(!map[key]){ map[key]=Object.assign({},o); order.push(key); }
      else { var t=map[key]; for(var f in o){ if(o[f]!=null&&o[f]!=='') t[f]=o[f]; } } // 뒤 값 우선 병합
    });
    var merged=order.map(function(k){return map[k];}).concat(noKey);
    return {merged:merged, removed:recs.length-merged.length};
  }
  function renderSummary(){
    var mode=document.getElementById('imp-key').value;
    var recs=buildRecords();
    var c=consolidate(recs,mode);
    var mapped=MAP.filter(Boolean).length;
    document.getElementById('imp-sum').innerHTML=
      '읽은 행 <b>'+RAW.length+'</b> · 매칭된 열 <b>'+mapped+'</b> · 중복 정리 <b>'+c.removed+'</b>건 → 추가될 오더 <b style="color:#0f6b74">'+c.merged.length+'</b>건';
  }
  document.addEventListener('change',function(e){ if(e.target&&e.target.id==='imp-key') renderSummary(); });

  function run(){
    var mode=document.getElementById('imp-key').value;
    var recs=buildRecords();
    if(!recs.length){ msg('가져올 데이터가 없습니다. 열 매칭을 확인하세요.'); return; }
    var c=consolidate(recs,mode);
    var cur=[]; try{ cur=JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){}
    var existing={};
    cur.forEach(function(u){ if(!u._deleted){ var k=dupKeyOf(u,mode); if(k) existing[k]=u; } });
    // 이미 내장(BASE) 데이터에 있는 건은 중복이므로 건너뜀
    var baseKeys={};
    try{ if(typeof ALL!=='undefined'){ ALL.forEach(function(u){ if(u._src==='base'){ var k=dupKeyOf(u,mode); if(k) baseKeys[k]=1; } }); } }catch(e){}
    var added=0, updated=0, skipped=0, stamp=Date.now();
    c.merged.forEach(function(o,idx){
      var key=dupKeyOf(o,mode);
      if(key && existing[key]){ for(var f in o){ if(o[f]!=null&&o[f]!=='') existing[key][f]=o[f]; } updated++; }
      else if(key && baseKeys[key]){ skipped++; }
      else { var ent=Object.assign({_src:'user',_id:'u'+stamp+'_'+idx}, o); cur.push(ent); if(key)existing[key]=ent; added++; }
    });
    try{ localStorage.setItem(LKEY, JSON.stringify(cur)); }
    catch(err){ msg('저장 공간 초과: 한 번에 너무 많습니다. 최근 날짜만 담은 파일로 나눠서 넣어주세요.'); return; }
    msg('완료 · 추가 '+added+'건, 갱신 '+updated+'건'+(skipped?', 기존중복 '+skipped+'건 제외':'')+'. 반영 중…');
    // 앱에 즉시 반영: 전역 훅이 있으면 사용, 없으면 새로고침
    try{
      if(typeof USER!=='undefined' && typeof rebuild==='function'){
        USER.length=0; JSON.parse(localStorage.getItem(LKEY)).forEach(function(x){USER.push(x);});
        rebuild(); if(typeof renderDay==='function') renderDay();
        setTimeout(close,600);
        return;
      }
    }catch(e){}
    setTimeout(function(){ location.reload(); }, 500);
  }

    +'.imp-run{background:#0f6b74;color:#fff;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer}'
    +'.imp-run:disabled{opacity:.45;cursor:default}';
  document.head.appendChild(css);

  // 긴 컬럼(연락처·주소·비고) 말줄임 + 클릭 펼침 스타일/동작
  var clipCss=document.createElement('style');
  clipCss.textContent=''
    +'#app-dispatch td.clipcell{max-width:160px}'
    +'#app-dispatch td.clipcell.tel{max-width:88px}'
    +'#app-dispatch td.memocell{overflow:visible}'
    +'#app-dispatch td.memocell .memoedit{min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:6px;padding:2px 6px;cursor:pointer}'
    +'#app-dispatch td.memocell .memoedit:not(:focus):not(:empty)::after{content:" ▾";color:var(--accent,#0f6b74);font-size:10px;opacity:.6}'
    +'#app-dispatch td.memocell .memoedit:hover{border-color:var(--line,#d7dde3)}'
    +'#app-dispatch td.memocell .memoedit:focus{white-space:pre-wrap;overflow:visible;word-break:break-word;cursor:text;outline:none;border-color:var(--accent,#0f6b74);background:var(--panel,#fff);box-shadow:0 0 0 2px rgba(15,107,116,.15)}'
    +'#app-dispatch td.memocell .memoedit:empty::before{content:"＋ 비고";color:var(--muted,#9aa6b1);font-size:12px}'
    +'#app-dispatch td.clipcell .clip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}'
    +'#app-dispatch td.clipcell .clip::after{content:" ▾";color:var(--accent,#0f6b74);font-size:10px;opacity:.6}'
    +'#app-dispatch td.clipcell .clip.open{white-space:normal;overflow:visible;word-break:break-all}'
    +'#app-dispatch td.clipcell .clip.open::after{content:" ▴"}'
    +'#app-dispatch td.clipcell .clip:empty::after{content:""}'
    // ── 당일배차 표: 날짜와 무관하게 동일 양식(고정 컬럼폭) ──
    +'#v-day{overflow-x:auto}'
    +'#v-day table{table-layout:fixed;width:100%;min-width:1780px}'
    +'#v-day thead th,#v-day tbody td{overflow:hidden}'
    +'#v-day tbody td:not(.clipcell):not(.memocell){text-overflow:ellipsis}'
    +'#v-day thead th:nth-child(1),#v-day tbody td:nth-child(1){width:52px}'    /* 시간 */
    +'#v-day thead th:nth-child(2),#v-day tbody td:nth-child(2){width:56px}'    /* 수출입 */
    +'#v-day thead th:nth-child(3),#v-day tbody td:nth-child(3){width:98px}'    /* 차량 */
    +'#v-day thead th:nth-child(4),#v-day tbody td:nth-child(4){width:120px}'   /* 화주 */
    +'#v-day thead th:nth-child(5),#v-day tbody td:nth-child(5){width:104px}'   /* 연락처(2배) */
    +'#v-day thead th:nth-child(6),#v-day tbody td:nth-child(6){width:168px}'   /* 주소 */
    +'#v-day thead th:nth-child(7),#v-day tbody td:nth-child(7){width:76px}'    /* 상차 */
    +'#v-day thead th:nth-child(8),#v-day tbody td:nth-child(8){width:76px}'    /* 하차(상차와 동일) */
    +'#v-day thead th:nth-child(9),#v-day tbody td:nth-child(9){width:52px}'    /* 규격 */
    +'#v-day thead th:nth-child(10),#v-day tbody td:nth-child(10){width:124px}' /* 컨번호 */
    +'#v-day thead th:nth-child(11),#v-day tbody td:nth-child(11){width:156px}' /* B/L */
    +'#v-day thead th:nth-child(12),#v-day tbody td:nth-child(12){width:100px}' /* D/O */
    +'#v-day thead th:nth-child(13),#v-day tbody td:nth-child(13){width:84px}'  /* 청구 */
    +'#v-day thead th:nth-child(14),#v-day tbody td:nth-child(14){width:84px}'  /* 하불 */
    +'#v-day thead th:nth-child(15),#v-day tbody td:nth-child(15){width:170px}' /* 작업 */
    +'#v-day thead th:nth-child(16),#v-day tbody td:nth-child(16){width:220px}' /* 비고(복제 뒤·클릭펼침·편집) */
    +'#v-day td.act{white-space:nowrap;overflow:visible}';
  document.head.appendChild(clipCss);
  document.addEventListener('click',function(e){
    var c=e.target && e.target.closest ? e.target.closest('#app-dispatch td.clipcell .clip') : null;
    if(!c) return;
    c.classList.toggle('open');
  });

  // ＋입력 폼: 차량번호 칸에서 포커스 벗어나면 약칭→풀넘버 자동 변환
  document.addEventListener('focusout',function(e){
    var t=e.target;
    if(!t||!t.getAttribute||t.getAttribute('data-k')!=='vno') return;
    var full=vehLookup(t.value);
    if(full && full!==String(t.value).trim()){
      t.value=full;
      try{ if(typeof editing!=='undefined'&&editing) editing.vno=full; }catch(err){}
      t.dispatchEvent(new Event('input',{bubbles:true}));
    }
  },true);

  // 버튼 부착 (배차일보 DOM 준비 대기)
  var tries=0; (function attach(){ addButton(); if(!document.getElementById('imp-btn') && tries++<40) setTimeout(attach,150); })();
})();
